
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacts | CRM</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px Arial,sans-serif;color:#40343c;background:#fffafb}
header{background:#80546b;color:white;padding:18px 26px;display:flex;justify-content:space-between;align-items:center}
header strong{font-size:22px}
.layout{display:flex;min-height:calc(100vh - 60px)}
aside{width:210px;background:#f5e8ef;padding:28px 18px;flex-shrink:0}
aside div{padding:14px;border-radius:6px;margin:5px 0}
.active{background:#e9cddd;font-weight:bold}
main{padding:30px;flex:1;min-width:0}
h1{font-size:27px;margin:0 0 24px}
.toolbar{padding:16px;background:white;border:1px solid #eadce4}
input{padding:10px 14px;border:1px solid #dbc6d2;border-radius:5px;font:inherit;width:260px;max-width:100%}
.table-wrap{overflow:auto;background:white;border:1px solid #eadce4}
table{border-collapse:collapse;width:100%;min-width:950px}
th,td{padding:16px;text-align:left;border-bottom:1px solid #eee3e9;white-space:nowrap}
th{background:#f7edf3;font-size:12px}
tbody tr:hover{background:#fff5fa;cursor:pointer}
.name{color:#985473;font-weight:bold}
.stage{background:#f0e0e9;padding:6px 10px;border-radius:4px;font-size:12px}
dialog{border:1px solid #eadce4;border-radius:12px;padding:30px;width:520px;max-width:92vw;color:#40343c}
dialog::backdrop{background:#30212b55}
.close{float:right;border:0;background:transparent;font-size:24px;cursor:pointer}
dl{display:grid;grid-template-columns:145px 1fr;gap:18px;line-height:1.5}
dt{color:#88717e}
dd{margin:0}
@media(max-width:700px){aside{display:none}main{padding:15px}}
</style>
</head>
<body>
<header><strong>CRM</strong><span>Dainty De Guzman</span></header>
<div class="layout">
<aside>
<div><strong>CRM</strong></div>
<div class="active">Contacts</div>
</aside>
<main>
<h1>Contacts</h1>
<div class="toolbar">
<input id="search" placeholder="Search contacts" oninput="render()">
<span id="count" style="margin-left:15px"></span>
</div>
<div class="table-wrap">
<table>
<thead><tr>
<th>Name</th><th>Email</th><th>Phone</th><th>Lead Type</th>
<th>Lead Stage</th><th>Budget</th><th>Market</th><th>Follow-up</th>
</tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
</main>
</div>
<dialog id="details">
<button class="close" onclick="details.close()" aria-label="Close">×</button>
<h2 id="person"></h2>
<dl id="information"></dl>
</dialog>
<script>
const leads=[
["Alexander Price","Buyer","Qualified",450000,"Austin, TX","3-bedroom house","Nov 23","Nov 27","Send agent-approved property options","Preapproval reported; verification pending."],
["Victoria Grant","Seller","Contacted",620000,"Denver, CO","Single-family home","Nov 24","Nov 28","Coordinate listing consultation","Requested information about the selling process."],
["Nathaniel Ross","Buyer","New",380000,"Phoenix, AZ","Townhouse","Nov 25","Nov 26","Confirm buying requirements","Prefers covered parking."],
["Gabriella Wood","Buyer","Viewing",510000,"Orlando, FL","4-bedroom house","Nov 23","Nov 29","Confirm viewing availability","Available on weekends."],
["Sebastian Hill","Investor","Qualified",750000,"Dallas, TX","Duplex","Nov 22","Nov 27","Forward property criteria to agent","Interested in long-term rental properties."],
["Penelope Adams","Seller","Nurturing",540000,"Charlotte, NC","Residential house","Nov 20","Dec 4","Check intended selling timeline","Considering a sale next year."],
["Theodore King","Buyer","Contacted",320000,"Columbus, OH","Condominium","Nov 24","Nov 28","Confirm preferred locations","Requested HOA information."],
["Violet James","Buyer","Qualified",490000,"Atlanta, GA","Townhouse","Nov 25","Nov 30","Coordinate agent consultation","Financing details awaiting verification."],
["Dominic Gray","Seller","Closed",580000,"Tampa, FL","Single-family home","Nov 19","—","Archive completed records","Transaction marked completed by agent."],
["Aurora White","Buyer","Nurturing",410000,"Raleigh, NC","3-bedroom house","Nov 18","Dec 8","Check search timeline","Purchase postponed."],
["Gabriel Clark","Investor","Contacted",890000,"Houston, TX","Multifamily property","Nov 24","Dec 1","Collect investment requirements","Requested property operating information."],
["Hazel Lewis","Buyer","Lost",290000,"Jacksonville, FL","Condominium","Nov 17","—","Close follow-up record","Client discontinued search."]
];
const money=n=>n.toLocaleString("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0});
const email=r=>r[0].toLowerCase().replace(" ",".")+"@example.com";
const phone=i=>"(202) 555-"+String(100+i).padStart(4,"0");
function render(){
const q=document.getElementById("search").value.toLowerCase();
const filtered=leads.map((r,i)=>({r,i})).filter(({r})=>r.join(" ").toLowerCase().includes(q)||email(r).includes(q));
document.getElementById("count").textContent=filtered.length+" contacts";
document.getElementById("rows").innerHTML=filtered.map(({r,i})=>`
<tr onclick="openLead(${i})" tabindex="0" onkeydown="if(event.key==='Enter')openLead(${i})">
<td class="name">${r[0]}</td><td>${email(r)}</td>
<td>${phone(i)}</td><td>${r[1]}</td>
<td><span class="stage">${r[2]}</span></td>
<td>${money(r[3])}</td><td>${r[4]}</td><td>${r[7]}</td>
</tr>`).join("");
}
function openLead(i){
const r=leads[i];
document.getElementById("person").textContent=r[0];
const fields=[
["Lead ID","RE-"+String(i+1).padStart(3,"0")],
["Email",email(r)],["Phone",phone(i)],["Lead type",r[1]],
["Lead stage",r[2]],["Budget",money(r[3])],["Market",r[4]],
["Property interest",r[5]],["Last contact",r[6]+", 2026"],
["Follow-up",r[7]],["Next action",r[8]],["Notes",r[9]]
];
document.getElementById("information").innerHTML=fields.map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join("");
document.getElementById("details").showModal();
}
render();
</script>
</body>
</html>
