
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Property Listing Administration</title>

<style>

:root {
    --pink: #a65f7d;
    --header: #faf0f5;
    --toolbar: #f4e6ee;
    --border: #e5dbe1;
    --text: #40343c;
    --muted: #87717e;
    --selected: #ead0df;
}

* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    font: 13px Arial, sans-serif;
    color: var(--text);
    background: white;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* HEADER */

header {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 16px 22px;
    background: var(--header);
    flex-shrink: 0;
}

.logo {
    width: 43px;
    height: 49px;
    background: var(--pink);
    color: white;
    border-radius: 5px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
}

.logo svg {
    width: 26px;
    height: 30px;
}

h1 {
    font-size: 20px;
    font-weight: 400;
    margin: 0 0 9px;
}

.sub {
    color: var(--muted);
    font-size: 12px;
}

.avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    margin-left: auto;
    flex-shrink: 0;
}

/* SHEET TITLE */

.bar {
    padding: 12px 20px;
    background: var(--toolbar);
    border-top: 1px solid #eadce4;
    border-bottom: 1px solid #dfced8;
    color: #745b6a;
    font-size: 12px;
    flex-shrink: 0;
}

/* SPREADSHEET */

.sheet {
    flex: 1;
    min-height: 0;
    overflow: auto;
    background: white;
}

table {
    border-collapse: separate;
    border-spacing: 0;
    width: max-content;
    min-width: 100%;
    table-layout: auto;
}

th, td {
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 12px;
    vertical-align: top;
    line-height: 1.6;
    min-width: 100px;
    max-width: 440px;
    overflow-wrap: break-word;
}

/* COLUMN LETTERS */

.letters th {
    background: #f2f0f1;
    text-align: center;
    color: #777;
    font-weight: 400;
    position: sticky;
    top: 0;
    z-index: 4;
    padding: 5px;
    height: 30px;
}

/* COLUMN HEADINGS */

.heading th {
    background: #b77b99;
    color: white;
    text-align: left;
    font-weight: 600;
    position: sticky;
    top: 30px;
    z-index: 3;
}

/* ROW NUMBERS */

.number {
    background: #f2f0f1 !important;
    color: #777 !important;
    text-align: center !important;
    min-width: 45px;
    width: 45px;
    max-width: 45px;
    font-weight: 400;
    position: sticky;
    left: 0;
    z-index: 2;
}

.letters .number {
    z-index: 6;
}

.heading .number {
    z-index: 5;
}

/* TABLE CONTENT */

tbody tr:nth-child(even) td {
    background: #fff8fc;
}

tbody tr:nth-child(odd) td {
    background: white;
}

td {
    font-size: 13px;
}

td.long-text {
    min-width: 340px;
    max-width: 440px;
}

td.medium-text {
    min-width: 180px;
    max-width: 300px;
}

/* SHEET TABS */

.tabs {
    min-height: 46px;
    background: #f8edf3;
    border-top: 1px solid #dfced8;
    display: flex;
    align-items: stretch;
    gap: 4px;
    padding: 0 15px;
    overflow-x: auto;
    flex-shrink: 0;
}

.tabs button {
    font: inherit;
    color: #745b6a;
    border: 0;
    border-bottom: 3px solid transparent;
    background: transparent;
    padding: 12px 20px;
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
}

.tabs button:hover {
    background: #f1dfe9;
}

.tabs button.active {
    background: var(--selected);
    color: #8c4e6b;
    font-weight: bold;
    border-bottom: 3px solid var(--pink);
}

.tabs button:focus-visible {
    outline: 2px solid var(--pink);
    outline-offset: -3px;
}

/* SCROLLBARS */

.sheet::-webkit-scrollbar,
.tabs::-webkit-scrollbar {
    width: 9px;
    height: 9px;
}

.sheet::-webkit-scrollbar-track,
.tabs::-webkit-scrollbar-track {
    background: #f6edf2;
}

.sheet::-webkit-scrollbar-thumb,
.tabs::-webkit-scrollbar-thumb {
    background: #d3b5c5;
    border-radius: 8px;
}

/* MOBILE */

@media (max-width: 600px) {

    header {
        padding: 13px 15px;
        gap: 10px;
    }

    h1 {
        font-size: 16px;
        line-height: 1.4;
        margin-bottom: 5px;
    }

    .logo {
        width: 35px;
        height: 41px;
    }

    .logo svg {
        width: 22px;
        height: 25px;
    }

    .avatar {
        width: 30px;
        height: 30px;
    }

    .bar {
        padding: 11px 15px;
    }

    th, td {
        padding: 10px;
        font-size: 12px;
    }

    .tabs {
        padding: 0 5px;
    }

    .tabs button {
        padding: 12px 15px;
        font-size: 12px;
    }

}

</style>
</head>

/* =========================================
   READ-ONLY SPREADSHEET FUNCTIONALITY
   ========================================= */

const table = document.getElementById("table");
const tabs = document.getElementById("tabs");
const sheetTitle = document.getElementById("sheetTitle");
const sheetPanel = document.getElementById("sheetPanel");

function columnLetter(index) {

    let letter = "";
    let number = index + 1;

    while (number > 0) {

        number--;

        letter =
            String.fromCharCode(65 + number % 26)
            + letter;

        number = Math.floor(number / 26);

    }

    return letter;

}

/* CREATE SHEET TABS */

function createTabs() {

    tabs.replaceChildren();

    sheets.forEach(function(sheet, index) {

        const button = document.createElement("button");

        button.type = "button";

        button.textContent = sheet.name;

        button.dataset.sheet = index;

        button.setAttribute("aria-pressed", "false");

        button.addEventListener("click", function() {

            openSheet(index);

        });

        tabs.appendChild(button);

    });

}

/* OPEN SELECTED SHEET */

function openSheet(index) {

    const sheet = sheets[index];

    if (!sheet) {
        return;
    }

    sheetTitle.textContent = sheet.name;

    table.setAttribute("aria-label", sheet.name);

    Array.from(tabs.children).forEach(function(button, i) {

        const active = i === index;

        button.classList.toggle("active", active);

        button.setAttribute(
            "aria-pressed",
            String(active)
        );

    });

    table.replaceChildren();

    /* TABLE HEAD */

    const thead = document.createElement("thead");

    /* COLUMN LETTERS */

    const letters = document.createElement("tr");

    letters.className = "letters";

    const corner = document.createElement("th");

    corner.className = "number";

    corner.setAttribute("aria-hidden", "true");

    letters.appendChild(corner);

    sheet.headers.forEach(function(header, i) {

        const th = document.createElement("th");

        th.textContent = columnLetter(i);

        letters.appendChild(th);

    });

    thead.appendChild(letters);

    /* FIELD HEADINGS */

    const heading = document.createElement("tr");

    heading.className = "heading";

    const firstNumber = document.createElement("th");

    firstNumber.className = "number";

    firstNumber.textContent = "1";

    heading.appendChild(firstNumber);

    sheet.headers.forEach(function(header) {

        const th = document.createElement("th");

        th.scope = "col";

        th.textContent = header;

        heading.appendChild(th);

    });

    thead.appendChild(heading);

    table.appendChild(thead);

    /* TABLE BODY */

    const tbody = document.createElement("tbody");

    sheet.rows.forEach(function(row, rowIndex) {

        const tr = document.createElement("tr");

        const number = document.createElement("th");

        number.className = "number";

        number.scope = "row";

        number.textContent = rowIndex + 2;

        tr.appendChild(number);

        row.forEach(function(value) {

            const td = document.createElement("td");

            td.textContent = value;

            if (value.length > 100) {

                td.className = "long-text";

            } else if (value.length > 25) {

                td.className = "medium-text";

            }

            tr.appendChild(td);

        });

        tbody.appendChild(tr);

    });

    table.appendChild(tbody);

    sheetPanel.scrollTop = 0;

    sheetPanel.scrollLeft = 0;

}

/* INITIALIZE */
