
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google Calendar</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

:root {
    --pink: #a65f7d;
    --background: #faf2f6;
    --border: #e6dce2;
    --text: #3c4043;
}

body {
    margin: 0;
    font: 14px Roboto, Arial, sans-serif;
    color: var(--text);
    background: var(--background);
}

button, input, select, textarea {
    font: inherit;
    color: inherit;
}

button {
    border: none;
    background: transparent;
    cursor: pointer;
}

button:hover {
    background: #f0e2ea;
}

.material-symbols-outlined {
    font-size: 22px;
    vertical-align: middle;
}

.icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: inline-grid;
    place-items: center;
    flex-shrink: 0;
}

.hidden {
    display: none !important;
}

header {
    height: 72px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 18px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 235px;
    flex-shrink: 0;
}

.logo {
    width: 38px;
    height: 38px;
}

.brand-name {
    font-size: 22px;
}

.today {
    border: 1px solid #c9bec5;
    border-radius: 24px;
    padding: 10px 23px;
    margin-right: 10px;
}

#monthTitle {
    font-size: 22px;
    font-weight: 400;
    margin-left: 8px;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-left: auto;
}

.view-select {
    background: transparent;
    border: 1px solid #c9bec5;
    border-radius: 24px;
    padding: 10px 18px;
}

.avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
}

.account {
    padding: 4px;
    border-radius: 50%;
}

.layout {
    display: flex;
    height: calc(100dvh - 72px);
    padding-bottom: 15px;
}

.sidebar {
    width: 255px;
    flex-shrink: 0;
    padding: 12px 20px;
    overflow: auto;
}

.sidebar.collapsed {
    display: none;
}

.create {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    border-radius: 17px;
    background: white;
    box-shadow: 0 2px 6px #0002;
    margin-bottom: 25px;
    font-weight: 500;
}

.create:hover {
    background: #fff9fc;
    box-shadow: 0 3px 9px #0003;
}

.mini-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 500;
    margin-bottom: 10px;
}

.mini-header .icon {
    width: 27px;
    height: 27px;
}

.mini-calendar {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    text-align: center;
    font-size: 11px;
}

.mini-day {
    width: 27px;
    height: 27px;
    padding: 0;
    border-radius: 50%;
}

.mini-day.selected {
    background: var(--pink);
    color: white;
}

.mini-day.outside {
    color: #a89da4;
}

.mini-weekday {
    color: #777;
    padding: 8px 0;
}

.sidebar-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 500;
    margin: 28px 0 10px;
}

.calendar-option {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    font-size: 13px;
    cursor: pointer;
}

.calendar-option input {
    width: 16px;
    height: 16px;
}

.main {
    flex: 1;
    min-width: 0;
    margin-right: 15px;
    background: white;
    border-radius: 22px;
    overflow: auto;
}

.month-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(100px, 1fr));
    grid-template-rows: 30px repeat(var(--weeks), minmax(110px, 1fr));
    min-width: 700px;
    min-height: 100%;
}

.weekday {
    text-align: center;
    font-size: 11px;
    color: #70757a;
    padding: 10px 0;
}

.day-cell {
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    padding: 5px 3px;
    cursor: pointer;
    min-width: 0;
}

.day-cell:hover {
    background: #fffbfd;
}

.day-number {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    margin: 0 auto 6px;
    font-size: 12px;
}

.day-number.selected {
    background: var(--pink);
    color: white;
}

.outside .day-number {
    color: #a7a0a4;
}

.event {
    display: flex;
    align-items: center;
    gap: 5px;
    width: 100%;
    text-align: left;
    padding: 5px 6px;
    margin-bottom: 2px;
    border-radius: 4px;
    font-size: 11px;
    overflow: hidden;
    white-space: nowrap;
}

.event:hover {
    background: #f3e4ec;
}

.event-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
}

.event-title {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.time-grid {
    min-width: 700px;
}

.time-header {
    display: grid;
    position: sticky;
    top: 0;
    z-index: 5;
    background: white;
    border-bottom: 1px solid var(--border);
}

.time-heading {
    text-align: center;
    padding: 12px 0;
    border-right: 1px solid var(--border);
}

.time-heading small {
    display: block;
    color: #777;
    font-size: 11px;
}

.time-heading strong {
    font-size: 26px;
    font-weight: 400;
    display: inline-grid;
    place-items: center;
    width: 42px;
    height: 42px;
    border-radius: 50%;
}

.time-heading strong.selected {
    background: var(--pink);
    color: white;
}

.time-body {
    display: grid;
}

.time-label {
    height: 64px;
    font-size: 10px;
    text-align: center;
    color: #777;
}

.time-day {
    position: relative;
    border-right: 1px solid var(--border);
}

.hour-cell {
    height: 64px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
}

.hour-cell:hover {
    background: #faf1f6;
}

.time-event {
    position: absolute;
    left: 3px;
    right: 5px;
    border-radius: 4px;
    color: white;
    padding: 7px;
    text-align: left;
    font-size: 11px;
    overflow: hidden;
}

.time-event strong {
    display: block;
    margin-bottom: 4px;
}

.agenda {
    padding: 20px 35px;
}

.agenda-row {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 20px 10px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
}

.agenda-row:hover {
    background: #fcf4f8;
}

.agenda-date {
    width: 110px;
    flex-shrink: 0;
}

.agenda-time {
    width: 150px;
    flex-shrink: 0;
}

.agenda-title {
    flex: 1;
}

.overlay {
    position: fixed;
    inset: 0;
    background: #0002;
    display: grid;
    place-items: center;
    padding: 20px;
    z-index: 100;
}

.dialog {
    background: #fff;
    width: 500px;
    max-width: 100%;
    max-height: 90dvh;
    overflow: auto;
    border-radius: 26px;
    box-shadow: 0 8px 30px #0003;
}

.dialog-toolbar {
    display: flex;
    justify-content: flex-end;
    padding: 10px 14px;
}

.dialog-content {
    padding: 5px 25px 30px;
}

.detail-title {
    display: flex;
    align-items: flex-start;
    gap: 18px;
    margin-bottom: 25px;
}

.detail-title h2 {
    font-size: 23px;
    font-weight: 400;
    margin: 0 0 8px;
}

.color-square {
    width: 16px;
    height: 16px;
    border-radius: 4px;
    flex-shrink: 0;
    margin-top: 6px;
}

.detail-date {
    line-height: 1.6;
    font-size: 13px;
}

.detail {
    display: flex;
    gap: 18px;
    align-items: flex-start;
    margin: 20px 0;
    line-height: 1.7;
}

.detail .material-symbols-outlined {
    color: #70757a;
    flex-shrink: 0;
}

.detail-text {
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    min-width: 0;
}

.event-form input,
.event-form textarea,
.event-form select {
    width: 100%;
    border: none;
    border-radius: 5px;
    padding: 12px;
    background: #f7f1f5;
    outline: none;
}

.event-form input:focus,
.event-form textarea:focus {
    box-shadow: 0 0 0 1px var(--pink);
}

.event-form textarea {
    min-height: 190px;
    resize: vertical;
    line-height: 1.7;
}

.event-form .title-input {
    font-size: 23px;
    background: transparent;
    border-bottom: 2px solid var(--pink);
    border-radius: 0;
    margin-bottom: 15px;
}

.form-row {
    display: flex;
    align-items: flex-start;
    gap: 15px;
    margin: 15px 0;
}

.form-row .material-symbols-outlined {
    margin-top: 12px;
    color: #70757a;
}

.form-fields {
    flex: 1;
    min-width: 0;
}

.time-fields {
    display: flex;
    gap: 8px;
    margin-top: 8px;
}

.save {
    background: var(--pink);
    color: white;
    border-radius: 22px;
    padding: 11px 25px;
    font-weight: 500;
}

.save:hover {
    background: #8f4d69;
}

.profile {
    position: fixed;
    top: 65px;
    right: 18px;
    width: 320px;
    max-width: 90vw;
    background: #f8eaf1;
    border-radius: 25px;
    padding: 25px;
    text-align: center;
    box-shadow: 0 5px 25px #0002;
    z-index: 200;
}

.profile img {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    object-fit: cover;
}

.profile h2 {
    font-weight: 400;
}

.profile p {
    font-size: 13px;
    overflow-wrap: anywhere;
}

.search-input {
    border: none;
    background: #f0e1e9;
    padding: 12px 18px;
    border-radius: 24px;
    outline: none;
    width: 240px;
}

.empty {
    padding: 60px;
    text-align: center;
    color: #777;
}

@media(max-width: 950px) {
    .brand {
        width: auto;
    }

    .brand-name {
        display: none;
    }

    .sidebar {
        width: 220px;
    }

    #monthTitle {
        font-size: 18px;
    }
}

@media(max-width: 650px) {
    header {
        flex-wrap: wrap;
        height: 110px;
        padding: 8px;
        gap: 4px;
    }

    .layout {
        height: calc(100dvh - 110px);
    }

    .sidebar {
        display: none;
    }

    .sidebar.mobile-open {
        display: block;
        position: fixed;
        top: 110px;
        bottom: 0;
        left: 0;
        background: var(--background);
        z-index: 50;
        box-shadow: 4px 0 15px #0002;
    }

    .logo {
        display: none;
    }

    .main {
        margin: 0 7px;
    }

    .today {
        padding: 8px 12px;
        margin: 0;
    }

    .header-right {
        gap: 3px;
    }

    .search-input {
        width: 150px;
    }

    .agenda {
        padding: 10px;
        min-width: 500px;
    }
}
</style>
</head>

        </button>

        </select>

        <button class="account" onclick="toggleProfile()">

    </div>

</header>

<div class="profile hidden" id="profile">

</div>

<div class="layout">

            <span id="miniTitle"></span>

            <div>
                <button class="icon" onclick="moveMini(-1)">
                    <span class="material-symbols-outlined">chevron_left</span>
                </button>

                <button class="icon" onclick="moveMini(1)">
                    <span class="material-symbols-outlined">chevron_right</span>
                </button>
            </div>

        </div>

        <div class="mini-calendar" id="miniCalendar"></div>

        <div class="sidebar-heading">
            My calendars
            <span class="material-symbols-outlined">expand_more</span>
        </div>

        <div id="calendarOptions"></div>

    </aside>

    <main class="main" id="calendar"></main>

</div>

<div class="overlay hidden" id="detailOverlay">

    <div class="dialog">

        <div class="dialog-toolbar">

            <button class="icon" title="Edit event" onclick="editEvent()">
                <span class="material-symbols-outlined">edit</span>
            </button>

            <button class="icon" title="Delete event" onclick="deleteEvent()">
                <span class="material-symbols-outlined">delete</span>
            </button>

            <button class="icon" title="Close" onclick="closeDialogs()">
                <span class="material-symbols-outlined">close</span>
            </button>

        </div>

        <div class="dialog-content" id="eventDetails"></div>

    </div>

</div>

<div class="overlay hidden" id="formOverlay">

    <div class="dialog">

        <div class="dialog-toolbar">
            <button class="icon" onclick="closeDialogs()">
                <span class="material-symbols-outlined">close</span>
            </button>
        </div>

        <div class="dialog-content">

            <form class="event-form" id="eventForm" onsubmit="saveEvent(event)">

                <input class="title-input" name="title"
                    placeholder="Add title" required>

                <div class="form-row">

                    <span class="material-symbols-outlined">schedule</span>

                    <div class="form-fields">

                        <input type="date" name="date" required>

                        <div class="time-fields">
                            <input type="time" name="start" required>
                            <input type="time" name="end" required>
                        </div>

                        <p style="font-size:12px;color:#777">
                            Eastern Time — New York
                        </p>

                    </div>

                </div>

                <div class="form-row">

                    <span class="material-symbols-outlined">group_add</span>

                    <div class="form-fields">
                        <input name="guest" placeholder="Add guests" type="email">
                    </div>

                </div>

                <div class="form-row">

                    <span class="material-symbols-outlined">location_on</span>

                    <div class="form-fields">
                        <input name="location" placeholder="Add location">
                    </div>

                </div>

                <div class="form-row">

                    <span class="material-symbols-outlined">notifications</span>

                    <div class="form-fields">
                        <select name="reminder">
                            <option>10 minutes before</option>
                            <option>30 minutes before</option>
                            <option>1 hour before</option>
                            <option>1 day before</option>
                            <option>No notification</option>
                        </select>
                    </div>

                </div>

                <div class="form-row">

                    <span class="material-symbols-outlined">calendar_today</span>

                    <div class="form-fields">
                        <select name="category">
                            <option>Property Showings</option>
                            <option>Consultations</option>
                            <option>Follow-ups</option>
                        </select>
                    </div>

                </div>

                <div class="form-row">

                    <span class="material-symbols-outlined">notes</span>

                    <div class="form-fields">
                        <textarea name="description"
                            placeholder="Add description"></textarea>
                    </div>

                </div>

                <div style="text-align:right">
                    <button class="save" type="submit">Save</button>
                </div>

            </form>

        </div>

    </div>

</div>

const STORAGE = "independent-property-calendar-v2";

let events;

try {
    events = JSON.parse(localStorage.getItem(STORAGE))
        || structuredClone(originalEvents);

    if (!Array.isArray(events)) throw new Error();
} catch {
    events = structuredClone(originalEvents);
}

let selectedDate = new Date(2026, 10, 25);
let miniDate = new Date(selectedDate);
let currentId = null;
let editingId = null;

const activeCategories = new Set(Object.keys(categories));

const weekdays = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

function esc(value) {
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#39;");
}

function icon(name) {
    return `<span class="material-symbols-outlined">${name}</span>`;
}

function save() {
    try {
        localStorage.setItem(STORAGE, JSON.stringify(events));
    } catch {}
}

function dateKey(date) {
    return date.getFullYear() + "-" +
        String(date.getMonth()+1).padStart(2,"0") + "-" +
        String(date.getDate()).padStart(2,"0");
}

function parseDate(value) {
    return new Date(value + "T12:00:00");
}

function addDays(date, number) {
    const result = new Date(date);
    result.setDate(result.getDate()+number);
    return result;
}

function addMonths(date, number) {
    const result = new Date(
        date.getFullYear(),
        date.getMonth()+number,
        1
    );

    const last = new Date(
        result.getFullYear(),
        result.getMonth()+1,
        0
    ).getDate();

    result.setDate(Math.min(date.getDate(),last));

    return result;
}

function monthName(date) {
    return date.toLocaleDateString("en-US",{
        month:"long",
        year:"numeric"
    });
}

function timeText(value) {
    const [h,m] = value.split(":").map(Number);

    return `${h%12||12}${m?":"+String(m).padStart(2,"0"):""}${h>=12?"pm":"am"}`;
}

function minutes(value) {
    const [h,m] = value.split(":").map(Number);
    return h*60+m;
}

function filteredEvents() {
    const query = document.getElementById("search")
        .value.trim().toLowerCase();

    return events.filter(event =>
        activeCategories.has(event.category) &&
        Object.values(event).join(" ").toLowerCase().includes(query)
    ).sort((a,b)=>
        a.date.localeCompare(b.date) ||
        a.start.localeCompare(b.start)
    );
}

function eventsOn(date) {
    return filteredEvents().filter(
        event => event.date === dateKey(date)
    );
}

function toggleSidebar() {
    const sidebar = document.getElementById("sidebar");

    sidebar.classList.toggle(
        window.innerWidth<=650 ? "mobile-open" : "collapsed"
    );
}

function toggleProfile() {
    document.getElementById("profile").classList.toggle("hidden");
}

function toggleSearch() {
    const input = document.getElementById("search");

    input.classList.toggle("hidden");

    if (input.classList.contains("hidden")) {
        input.value = "";
        render();
    } else {
        input.focus();
    }
}

function goToday() {
    const today = new Intl.DateTimeFormat("en-CA",{
        timeZone:"America/New_York",
        year:"numeric",
        month:"2-digit",
        day:"2-digit"
    }).formatToParts(new Date());

    const parts = Object.fromEntries(
        today.map(item=>[item.type,item.value])
    );

    selectedDate = new Date(
        Number(parts.year),
        Number(parts.month)-1,
        Number(parts.day)
    );

    miniDate = new Date(selectedDate);

    render();
}

function move(direction) {
    const view = document.getElementById("view").value;

    selectedDate = view==="month" || view==="schedule"
        ? addMonths(selectedDate,direction)
        : addDays(selectedDate,direction*(view==="week"?7:1));

    miniDate = new Date(selectedDate);

    render();
}

function moveMini(direction) {
    miniDate = addMonths(miniDate,direction);
    renderMini();
}

function chooseDate(value) {
    selectedDate = parseDate(value);
    miniDate = new Date(selectedDate);
    render();
}

function renderMini() {
    document.getElementById("miniTitle").textContent =
        monthName(miniDate);

    const first = new Date(
        miniDate.getFullYear(),
        miniDate.getMonth(),
        1
    );

    const start = addDays(first,-first.getDay());

    let html = weekdays.map(day=>
        `<div class="mini-weekday">${day[0]}</div>`
    ).join("");

    for(let i=0;i<42;i++) {

        const date = addDays(start,i);

        html += `
            <button class="mini-day
                ${date.getMonth()!==miniDate.getMonth()?"outside":""}
                ${dateKey(date)===dateKey(selectedDate)?"selected":""}"
                onclick="chooseDate('${dateKey(date)}')">
                ${date.getDate()}
            </button>
        `;
    }

    document.getElementById("miniCalendar").innerHTML = html;
}

function renderOptions() {
    document.getElementById("calendarOptions").innerHTML =
        Object.entries(categories).map(([name,color])=>`
            <label class="calendar-option">
                <input type="checkbox"
                    style="accent-color:${color}"
                    ${activeCategories.has(name)?"checked":""}
                    onchange="toggleCategory('${name}',this.checked)">
                ${name}
            </label>
        `).join("");
}

function toggleCategory(name,checked) {
    checked
        ? activeCategories.add(name)
        : activeCategories.delete(name);

    render();
}

function renderMonth() {
    const first = new Date(
        selectedDate.getFullYear(),
        selectedDate.getMonth(),
        1
    );

    const days = new Date(
        selectedDate.getFullYear(),
        selectedDate.getMonth()+1,
        0
    ).getDate();

    const weeks = Math.ceil((first.getDay()+days)/7);

    const start = addDays(first,-first.getDay());

    let html = `<div class="month-grid" style="--weeks:${weeks}">`;

    html += weekdays.map(day=>
        `<div class="weekday">${day.toUpperCase()}</div>`
    ).join("");

    for(let i=0;i<weeks*7;i++) {

        const date = addDays(start,i);

        html += `
            <div class="day-cell
                ${date.getMonth()!==selectedDate.getMonth()?"outside":""}"
                onclick="openForm('${dateKey(date)}')">

                <div class="day-number
                    ${dateKey(date)===dateKey(selectedDate)?"selected":""}">
                    ${date.getDate()}
                </div>

                ${eventsOn(date).map(event=>`
                    <button class="event"
                        title="${esc(event.title)}"
                        onclick="event.stopPropagation();openEvent(${event.id})">

                        <span class="event-dot"
                            style="background:${categories[event.category]}">
                        </span>

                        <span>${timeText(event.start)}</span>

                        <span class="event-title">
                            ${esc(event.title)}
                        </span>

                    </button>
                `).join("")}

            </div>
        `;
    }

    document.getElementById("calendar").innerHTML =
        html+"</div>";
}

function renderTimeGrid(view) {

    const count = view==="week"?7:1;

    const first = view==="week"
        ? addDays(selectedDate,-selectedDate.getDay())
        : selectedDate;

    const dates = Array.from(
        {length:count},
        (_,i)=>addDays(first,i)
    );

    const columns = `65px repeat(${count},minmax(100px,1fr))`;

    let html = `
        <div class="time-grid">

            <div class="time-header"
                style="grid-template-columns:${columns}">

                <div style="align-self:end;text-align:center;
                    font-size:10px;padding:10px">
                    ET
                </div>

                ${dates.map(date=>`
                    <div class="time-heading">
                        <small>${weekdays[date.getDay()].toUpperCase()}</small>
                        <strong class="${dateKey(date)===dateKey(selectedDate)?"selected":""}">
                            ${date.getDate()}
                        </strong>
                    </div>
                `).join("")}

            </div>

            <div class="time-body"
                style="grid-template-columns:${columns}">

                <div>
    `;

    for(let hour=0;hour<24;hour++) {
        html += `<div class="time-label">
            ${timeText(String(hour).padStart(2,"0")+":00")}
        </div>`;
    }

    html += "</div>";

    dates.forEach(date=>{

        html += '<div class="time-day">';

        for(let hour=0;hour<24;hour++) {

            html += `
                <div class="hour-cell"
                    onclick="openForm('${dateKey(date)}','${String(hour).padStart(2,"0")}:00')">
                </div>
            `;
        }

        const daily = eventsOn(date);

        daily.forEach(event=>{

            const start = minutes(event.start);
            const end = minutes(event.end);

            const overlapping = daily.filter(other=>
                minutes(other.start)<end &&
                minutes(other.end)>start
            );

            const position = overlapping.findIndex(
                other=>other.id===event.id
            );

            const width = 100/overlapping.length;

            html += `
                <button class="time-event"
                    style="
                        background:${categories[event.category]};
                        top:${start/60*64}px;
                        height:${Math.max(24,(end-start)/60*64-3)}px;
                        left:calc(${position*width}% + 3px);
                        width:calc(${width}% - 6px);
                        right:auto;
                    "
                    onclick="openEvent(${event.id})">

                    <strong>${esc(event.title)}</strong>

                    ${timeText(event.start)} – ${timeText(event.end)}

                </button>
            `;
        });

        html += "</div>";
    });

    document.getElementById("calendar").innerHTML =
        html+"</div></div>";

    document.getElementById("calendar").scrollTop = 7*64;
}

function renderSchedule() {

    const query = document.getElementById("search").value.trim();

    const list = filteredEvents().filter(event=>
        query || event.date.startsWith(dateKey(selectedDate).slice(0,7))
    );

    document.getElementById("calendar").innerHTML = `
        <div class="agenda">

            ${list.length?list.map(event=>`

                <div class="agenda-row" onclick="openEvent(${event.id})">

                    <div class="agenda-date">

                        <strong style="font-size:23px;font-weight:400">
                            ${parseDate(event.date).getDate()}
                        </strong>

                        <div style="font-size:12px;color:#777">
                            ${parseDate(event.date).toLocaleDateString("en-US",{
                                weekday:"short",
                                month:"short"
                            })}
                        </div>

                    </div>

                    <span class="event-dot"
                        style="background:${categories[event.category]}">
                    </span>

                    <div class="agenda-time">
                        ${timeText(event.start)} – ${timeText(event.end)}
                    </div>

                    <div class="agenda-title">
                        ${esc(event.title)}
                    </div>

                </div>

            `).join(""):'<div class="empty">No events</div>'}

        </div>
    `;
}

function render() {

    const view = document.getElementById("view").value;

    document.getElementById("monthTitle").textContent =
        view==="day"
            ? selectedDate.toLocaleDateString("en-US",{
                month:"long",
                day:"numeric",
                year:"numeric"
            })
            : monthName(selectedDate);

    renderMini();

    if(document.getElementById("search").value.trim() ||
        view==="schedule") {

        renderSchedule();

    } else if(view==="month") {

        renderMonth();

    } else {

        renderTimeGrid(view);
    }
}

function detail(symbol,value) {

    if(!value) return "";

    return `
        <div class="detail">
            ${icon(symbol)}
            <div class="detail-text">${esc(value)}</div>
        </div>
    `;
}

function openEvent(id) {

    const event = events.find(item=>item.id===id);

    if(!event) return;

    currentId = id;

    const date = parseDate(event.date).toLocaleDateString("en-US",{
        weekday:"long",
        month:"long",
        day:"numeric"
    });

    document.getElementById("eventDetails").innerHTML = `

        <div class="detail-title">

            <div class="color-square"
                style="background:${categories[event.category]}">
            </div>

            <div>

                <h2>${esc(event.title)}</h2>

                <div class="detail-date">
                    ${date} ·
                    ${timeText(event.start)} – ${timeText(event.end)}
                    ET
                </div>

            </div>

        </div>

        ${detail("location_on",event.location)}

        ${detail("group",event.guest
            ? "Organizer: "+ACCOUNT+"\nGuest: "+event.guest
            : ACCOUNT)}

        ${detail("notes",event.description)}

        ${detail("notifications",event.reminder)}

        ${detail("calendar_today",event.category)}

    `;

    document.getElementById("detailOverlay").classList.remove("hidden");
}

function closeDialogs() {

    document.getElementById("detailOverlay").classList.add("hidden");

    document.getElementById("formOverlay").classList.add("hidden");

    currentId = null;
    editingId = null;
}

function openForm(date=dateKey(selectedDate),start="09:00") {

    closeDialogs();

    const form = document.getElementById("eventForm");

    form.reset();

    form.elements.date.value = date;
    form.elements.start.value = start;

    const end = Math.min(minutes(start)+60,1439);

    form.elements.end.value =
        String(Math.floor(end/60)).padStart(2,"0")+":"+
        String(end%60).padStart(2,"0");

    document.getElementById("formOverlay").classList.remove("hidden");

    form.elements.title.focus();
}

function editEvent() {

    const event = events.find(item=>item.id===currentId);

    if(!event) return;

    openForm(event.date,event.start);

    editingId = event.id;

    const form = document.getElementById("eventForm");

    Object.entries(event).forEach(([name,value])=>{

        if(form.elements.namedItem(name)) {
            form.elements.namedItem(name).value = value;
        }
    });
}

function saveEvent(submission) {

    submission.preventDefault();

    const data = Object.fromEntries(
        new FormData(submission.target)
    );

    if(minutes(data.end)<=minutes(data.start)) {

        alert("End time must be after the start time.");

        return;
    }

    const appointment = {
        id:editingId||Date.now(),
        ...data
    };

    if(editingId) {

        events = events.map(event=>
            event.id===editingId?appointment:event
        );

    } else {

        events.push(appointment);
    }

    save();

    closeDialogs();

    selectedDate = parseDate(data.date);
    miniDate = new Date(selectedDate);

    render();
}

function deleteEvent() {

    if(!confirm("Delete this event?")) return;

    events = events.filter(event=>event.id!==currentId);

    save();

    closeDialogs();

    render();
}

document.querySelectorAll(".overlay").forEach(overlay=>{

    overlay.addEventListener("click",event=>{

        if(event.target===overlay) closeDialogs();
    });
});

document.addEventListener("keydown",event=>{

    if(event.key==="Escape") {

        closeDialogs();

        document.getElementById("profile").classList.add("hidden");
    }
});

document.addEventListener("click",event=>{

    if(!event.target.closest(".profile") &&
        !event.target.closest(".account")) {

        document.getElementById("profile").classList.add("hidden");
    }
});

renderOptions();
render();

</script>
