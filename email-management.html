
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbox | Dainty De Guzman</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" rel="stylesheet">

<style>
:root {
    --pink: #a65f7d;
    --background: #faf2f6;
    --selected: #efd3e2;
    --border: #eee3e9;
    --text: #302a2e;
    --muted: #756b71;
}

* { box-sizing: border-box; }

body {
    margin: 0;
    font: 14px Roboto, Arial, sans-serif;
    background: var(--background);
    color: var(--text);
}

button, input, textarea {
    font: inherit;
}

button {
    border: none;
    background: transparent;
    color: inherit;
    cursor: pointer;
}

button:hover { background: #eee0e8; }

.material-symbols-outlined {
    font-size: 21px;
    vertical-align: middle;
}

.icon {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: inline-grid;
    place-items: center;
    flex-shrink: 0;
}

.hidden { display: none !important; }

header {
    height: 72px;
    display: flex;
    align-items: center;
    padding: 10px 20px;
    gap: 18px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 220px;
    flex-shrink: 0;
}

.brand-name {
    font-size: 23px;
    color: #60535b;
}

.search {
    display: flex;
    align-items: center;
    flex: 1;
    max-width: 720px;
    background: #f0e2ea;
    padding: 5px 14px;
    border-radius: 30px;
}

.search input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    padding: 12px;
}

.account {
    margin-left: auto;
    border-radius: 50%;
    padding: 4px;
}

.avatar {
    width: 39px;
    height: 39px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
}

.profile {
    position: fixed;
    top: 68px;
    right: 18px;
    width: 330px;
    max-width: 90vw;
    border-radius: 25px;
    padding: 25px;
    text-align: center;
    background: #f8eaf1;
    box-shadow: 0 5px 25px #0002;
    z-index: 100;
}

.profile img {
    width: 85px;
    height: 85px;
    object-fit: cover;
    border-radius: 50%;
    margin-top: 15px;
}

.profile p {
    overflow-wrap: anywhere;
    font-size: 13px;
}

.profile h2 {
    font-size: 22px;
    font-weight: 400;
}

.layout {
    display: flex;
    height: calc(100dvh - 72px);
    padding-bottom: 15px;
}

.sidebar {
    width: 250px;
    flex-shrink: 0;
    padding: 10px 12px 20px 0;
    overflow: auto;
}

.compose {
    background: #eac5d8;
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 18px 24px;
    border-radius: 17px;
    margin: 0 0 22px 15px;
    font-weight: 500;
}

.compose:hover {
    background: #eac5d8;
    box-shadow: 0 3px 9px #0002;
}

.nav {
    display: flex;
    align-items: center;
    gap: 17px;
    width: 100%;
    padding: 11px 25px;
    border-radius: 0 25px 25px 0;
    text-align: left;
}

.nav.active {
    background: var(--selected);
    font-weight: 700;
}

.count {
    margin-left: auto;
    font-size: 12px;
}

.labels-title {
    padding: 28px 25px 12px;
    font-size: 16px;
    font-weight: 500;
}

.sidebar.collapsed { width: 75px; }

.sidebar.collapsed .nav-text,
.sidebar.collapsed .count,
.sidebar.collapsed .labels-title,
.sidebar.collapsed .compose-text {
    display: none;
}

.sidebar.collapsed .nav {
    justify-content: center;
    padding: 12px;
}

.sidebar.collapsed .compose {
    padding: 15px;
    margin-left: 10px;
}

.main {
    flex: 1;
    min-width: 0;
    background: white;
    margin-right: 16px;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 18px;
    min-height: 56px;
}

.toolbar-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--muted);
}

input[type="checkbox"] {
    width: 15px;
    height: 15px;
    accent-color: var(--pink);
    cursor: pointer;
}

.tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
}

.tab {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 18px 24px;
    border-bottom: 3px solid var(--pink);
    color: var(--pink);
    font-weight: 500;
    min-width: 220px;
}

.mail-list {
    flex: 1;
    overflow: auto;
}

.mail-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 18px;
    min-height: 48px;
    background: #fcf7fa;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
}

.mail-row.unread {
    background: white;
    font-weight: 700;
}

.mail-row.selected {
    background: #efd9e5;
}

.mail-row:hover {
    box-shadow: inset 0 1px #ded1d9,
                inset 0 -1px #ded1d9,
                0 2px 5px #0001;
}

.star {
    color: #a99da5;
    font-size: 23px;
    padding: 2px;
}

.star.on { color: #d4a139; }

.important {
    color: #b9adb4;
    padding: 3px;
}

.important.on { color: var(--pink); }

.sender {
    width: 170px;
    flex-shrink: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.summary {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.snippet {
    font-weight: 400;
    color: var(--muted);
}

.date {
    font-size: 12px;
    width: 65px;
    flex-shrink: 0;
    text-align: right;
}

.label {
    background: #f1e0ea;
    color: #80536b;
    font-size: 10px;
    padding: 4px 7px;
    border-radius: 4px;
    white-space: nowrap;
    font-weight: 400;
}

.label.approval {
    background: #f7e8ce;
    color: #89632d;
}

.empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
}

.reader {
    overflow: auto;
    flex: 1;
}

.thread {
    max-width: 1000px;
    margin: auto;
    padding: 28px 45px 50px;
}

.subject {
    font-size: 25px;
    font-weight: 400;
    line-height: 1.4;
    margin: 0 0 15px;
}

.thread-labels {
    display: flex;
    gap: 7px;
    margin-bottom: 30px;
    flex-wrap: wrap;
}

.message-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
}

.sender-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #eac5d8;
    color: #654256;
    display: grid;
    place-items: center;
    flex-shrink: 0;
}

.meta {
    flex: 1;
    min-width: 0;
    line-height: 1.7;
}

.address {
    color: var(--muted);
    font-size: 12px;
    overflow-wrap: anywhere;
}

.message-time {
    font-size: 12px;
    color: var(--muted);
}

.message {
    white-space: pre-wrap;
    line-height: 1.85;
    padding: 20px 0 25px 54px;
    overflow-wrap: anywhere;
}

hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 20px 0 30px;
}

.reply-box {
    margin: 20px 0 0 54px;
    border: 1px solid #e3d3dc;
    border-radius: 12px;
    box-shadow: 0 2px 6px #0001;
    overflow: hidden;
}

.reply-box textarea {
    display: block;
    width: 100%;
    min-height: 340px;
    padding: 20px;
    border: none;
    outline: none;
    resize: vertical;
    line-height: 1.8;
}

.reply-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    padding: 15px;
}

.primary {
    background: var(--pink);
    color: white;
    border-radius: 22px;
    padding: 11px 23px;
    font-weight: 500;
}

.primary:hover {
    background: #8f4e6a;
}

.secondary {
    border: 1px solid #ddc9d4;
    border-radius: 22px;
    padding: 10px 17px;
}

.compose-window {
    position: fixed;
    bottom: 0;
    right: 25px;
    width: 550px;
    max-width: calc(100vw - 25px);
    max-height: 90dvh;
    overflow: auto;
    background: white;
    border-radius: 12px 12px 0 0;
    box-shadow: 0 0 30px #0003;
    z-index: 110;
}

.compose-header {
    background: #efd9e5;
    padding: 13px 17px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-weight: 500;
}

.compose-field {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 17px;
    border-bottom: 1px solid var(--border);
}

.compose-field input {
    flex: 1;
    min-width: 0;
    border: none;
    outline: none;
}

.compose-window textarea {
    width: 100%;
    min-height: 250px;
    padding: 20px;
    border: none;
    outline: none;
    resize: vertical;
    line-height: 1.7;
}

.toast {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: #503743;
    color: white;
    padding: 15px 22px;
    border-radius: 6px;
    z-index: 200;
}

.notice {
    padding: 9px 18px;
    font-size: 10px;
    color: var(--muted);
    border-top: 1px solid var(--border);
}

@media(max-width: 900px) {
    .brand { width: auto; }
    .brand-name { display: none; }
    .sender { width: 125px; }
    .row-label { display: none; }
}

@media(max-width: 650px) {
    header { padding: 8px; gap: 6px; }
    .sidebar { width: 65px; }
    .sidebar .nav-text,
    .sidebar .count,
    .sidebar .labels-title,
    .sidebar .compose-text { display: none; }
    .sidebar .nav { justify-content: center; padding: 12px; }
    .compose { padding: 13px; margin-left: 7px; }
    .main { margin-right: 7px; }
    .brand svg { display: none; }
    .mail-row { flex-wrap: wrap; padding: 12px; }
    .sender { flex: 1; width: auto; }
    .summary { flex-basis: 100%; white-space: normal; }
    .date { margin-left: auto; }
    .thread { padding: 20px; }
    .message { padding-left: 0; }
    .reply-box { margin-left: 0; }
    .message-header { flex-wrap: wrap; }
    .toolbar { padding: 8px; gap: 1px; }
    .toolbar .icon { width: 30px; }
    .toolbar-right .icon { display: none; }
}
</style>
</head>

<body>

<header>
    <div class="brand">

        <button class="icon" title="Main menu"
            onclick="document.getElementById('sidebar').classList.toggle('collapsed')">
            <span class="material-symbols-outlined">menu</span>
        </button>

        <svg width="35" height="28" viewBox="0 0 40 32">
            <path d="M3 29V5L20 18L37 5V29"
                fill="none" stroke="#a65f7d"
                stroke-width="6" stroke-linejoin="round"/>
            <path d="M3 5L20 18L37 5"
                fill="none" stroke="#dca7c0"
                stroke-width="6" stroke-linejoin="round"/>
        </svg>

        <span class="brand-name">Gmail</span>
    </div>

    <div class="search">
        <span class="material-symbols-outlined">search</span>
        <input id="search" placeholder="Search mail"
            oninput="searchMail()">
        <button class="icon" title="Clear search"
            onclick="clearSearch()">
            <span class="material-symbols-outlined">close</span>
        </button>
    </div>

    <button class="account" title="Account"
        onclick="document.getElementById('profile').classList.toggle('hidden')">
        <img class="avatar" src="dainty-profile.jpeg"
            alt="Dainty De Guzman">
    </button>
</header>

<div class="profile hidden" id="profile">
    <p>daintydeguzman.work@gmail.com</p>
    <img src="dainty-profile.jpeg" alt="Dainty De Guzman">
    <h2>Hi, Dainty!</h2>
    <button class="secondary"
        onclick="document.getElementById('profile').classList.add('hidden')">
        Close
    </button>
</div>

<div class="layout">

<aside class="sidebar" id="sidebar">

    <button class="compose" onclick="openCompose()">
        <span class="material-symbols-outlined">edit</span>
        <span class="compose-text">Compose</span>
    </button>

    <div id="folders"></div>

    <div class="labels-title">Labels</div>

    <div id="labels"></div>

</aside>

<main class="main">

    <div class="toolbar" id="listToolbar">

        <input type="checkbox" id="selectAll"
            title="Select all"
            onchange="selectAll(this.checked)">

        <button class="icon" title="Refresh"
            onclick="render()">
            <span class="material-symbols-outlined">refresh</span>
        </button>

        <button class="icon" title="Archive"
            onclick="bulk('archive')">
            <span class="material-symbols-outlined">archive</span>
        </button>

        <button class="icon" title="Delete"
            onclick="bulk('trash')">
            <span class="material-symbols-outlined">delete</span>
        </button>

        <button class="icon" title="Mark as unread"
            onclick="bulk('unread')">
            <span class="material-symbols-outlined">mark_email_unread</span>
        </button>

        <div class="toolbar-right">
            <span id="recordCount"></span>

            <button class="icon" title="Previous page"
                onclick="changePage(-1)">
                <span class="material-symbols-outlined">chevron_left</span>
            </button>

            <button class="icon" title="Next page"
                onclick="changePage(1)">
                <span class="material-symbols-outlined">chevron_right</span>
            </button>
        </div>

    </div>

    <div class="tabs" id="tabs">
        <div class="tab">
            <span class="material-symbols-outlined">inbox</span>
            <span id="folderTitle">Primary</span>
        </div>
    </div>

    <div class="mail-list" id="mailList"></div>

    <div class="toolbar hidden" id="readerToolbar">

        <button class="icon" title="Back"
            onclick="closeMail()">
            <span class="material-symbols-outlined">arrow_back</span>
        </button>

        <button class="icon" title="Archive"
            onclick="single('archive')">
            <span class="material-symbols-outlined">archive</span>
        </button>

        <button class="icon" title="Delete"
            onclick="single('trash')">
            <span class="material-symbols-outlined">delete</span>
        </button>

        <button class="icon" title="Mark unread"
            onclick="single('unread')">
            <span class="material-symbols-outlined">mark_email_unread</span>
        </button>

        <button class="icon" title="Move to inbox"
            onclick="single('restore')">
            <span class="material-symbols-outlined">move_to_inbox</span>
        </button>

        <div class="toolbar-right">
            <button class="icon" title="Previous email"
                onclick="navigate(-1)">
                <span class="material-symbols-outlined">chevron_left</span>
            </button>

            <button class="icon" title="Next email"
                onclick="navigate(1)">
                <span class="material-symbols-outlined">chevron_right</span>
            </button>
        </div>

    </div>

    <div class="reader hidden" id="reader">
        <div class="thread" id="thread"></div>
    </div>

    <div class="notice">
        Fictional portfolio mailbox. No real emails are sent.
    </div>

</main>
</div>

<div class="compose-window hidden" id="composeWindow">

    <div class="compose-header">
        New Message
        <button onclick="closeCompose()" title="Close">
            <span class="material-symbols-outlined">close</span>
        </button>
    </div>

    <form id="composeForm" onsubmit="saveNewMail(event)">

        <div class="compose-field">
            <span>To</span>
            <input type="email" name="recipient" required>
        </div>

        <div class="compose-field">
            <input name="subject" placeholder="Subject" required>
        </div>

        <textarea name="body" required></textarea>

        <div class="reply-actions">

            <button class="primary" type="submit">
                Save Draft
            </button>

            <button type="button" class="icon"
                title="Discard"
                onclick="document.getElementById('composeForm').reset();closeCompose()">
                <span class="material-symbols-outlined">delete</span>
            </button>

        </div>

    </form>
</div>

<div class="toast hidden" id="toast"></div>

<script>

const ACCOUNT = "daintydeguzman.work@gmail.com";
const NAME = "Dainty De Guzman";
const PHOTO = "dainty-profile.jpeg";

const signature = `

Best regards,
Dainty De Guzman
Real Estate Administrative Support
daintydeguzman.work@gmail.com`;

/* INDEPENDENT EMAIL CONVERSATIONS */

const original = [

{
    id: 1,
    name: "Charlotte Hayes",
    email: "charlotte.hayes@example.com",
    subject: "Inquiry about available homes in Raleigh",
    date: "2026-11-25",
    time: "10:24 AM",
    label: "Buyer",
    unread: true,
    starred: true,
    important: true,
    approval: false,
    status: "sent",

    incoming: `Hi,

My husband and I are planning to move to Raleigh, North Carolina, early next year. We are currently looking for a three-bedroom home with at least two bathrooms.

Our budget is approximately $420,000, and we would prefer a property with a garage and a backyard.

Could you let us know how we can get started?

Thank you,
Charlotte Hayes`,

    reply: `Hi Charlotte,

Thank you for reaching out! We'd be happy to assist you with your upcoming move to Raleigh.

I've noted your preference for a three-bedroom, two-bathroom home with a garage and backyard, within your approximate budget of $420,000.

To help our agent narrow down your options, could you please share your preferred move-in timeline and whether you have already started the mortgage preapproval process?

It would also be helpful to know if you have any particular neighborhoods in mind.

Once we receive these details, our agent can review your requirements and discuss suitable next steps.

We look forward to helping you with your home search.` + signature
},

{
    id: 2,
    name: "Daniel Foster",
    email: "daniel.foster@example.com",
    subject: "Request to reschedule Saturday's property showing",
    date: "2026-11-25",
    time: "9:16 AM",
    label: "Showings",
    unread: true,
    starred: false,
    important: true,
    approval: false,
    status: "sent",

    incoming: `Hi Dainty,

Something has come up at work, and unfortunately I won't be able to attend the property showing this Saturday morning.

Would it be possible to move the appointment to Monday afternoon instead?

I'm available anytime after 2 PM.

Sorry for the inconvenience, and thank you for understanding.

Daniel`,

    reply: `Hi Daniel,

Thank you for letting me know. No worries at all!

I've noted your availability for Monday afternoon after 2 PM and will coordinate with the assigned agent regarding the requested change.

Your new appointment time is currently pending confirmation. I'll send you the updated details as soon as the agent and property access arrangements have been confirmed.

Thank you for your flexibility, and please feel free to let me know if your availability changes again.` + signature
},

{
    id: 3,
    name: "Madison Clarke",
    email: "madison.clarke@example.com",
    subject: "Questions about listing my property",
    date: "2026-11-24",
    time: "3:42 PM",
    label: "Seller",
    unread: true,
    starred: true,
    important: true,
    approval: true,
    status: "draft",

    incoming: `Hello,

I'm considering selling my property in Tampa, Florida. It's a four-bedroom house with three bathrooms and a recently renovated kitchen.

I was hoping to list it for around $560,000.

Could you tell me whether that is a reasonable asking price and what your commission would be?

I'd also like to understand how long the selling process usually takes.

Kind regards,
Madison Clarke`,

    reply: `Hi Madison,

Thank you for considering our team to assist with the sale of your property.

I've noted the details you provided, including your recent kitchen renovation and proposed asking price of $560,000.

Our listing agent would be the best person to discuss an appropriate pricing strategy, commission arrangements, and the anticipated selling timeline based on your property's characteristics and current market conditions.

I'd be happy to help arrange an initial consultation.

Could you please provide the property's address and two or three convenient times for a meeting with our agent?

We look forward to learning more about your property and discussing your selling goals.` + signature
},

{
    id: 4,
    name: "Benjamin Scott",
    email: "benjamin.scott@example.com",
    subject: "Following up on the documents I submitted",
    date: "2026-11-23",
    time: "11:08 AM",
    label: "Documents",
    unread: false,
    starred: false,
    important: true,
    approval: false,
    status: "sent",

    incoming: `Hi,

I sent the requested documents through the secure upload link yesterday and wanted to make sure everything was received.

Please let me know if there is anything else I need to submit before our next appointment.

Thanks,
Benjamin Scott`,

    reply: `Hi Benjamin,

Thank you for the update.

I've noted that you submitted the requested documents through the secure upload link yesterday.

I'll coordinate with the assigned team member to verify receipt and check whether any additional documents are required before your next appointment.

For your privacy, please continue using the designated secure upload channel rather than sending sensitive financial or identification documents through regular email.

We'll be in touch once the review has been completed.

Thank you for your cooperation.` + signature
},

{
    id: 5,
    name: "Amelia Parker",
    email: "amelia.parker@example.com",
    subject: "Checking the availability of a listed condominium",
    date: "2026-11-22",
    time: "2:35 PM",
    label: "Buyer",
    unread: false,
    starred: true,
    important: false,
    approval: true,
    status: "draft",

    incoming: `Hello,

I recently saw a two-bedroom condominium advertised in Scottsdale, Arizona, and I'm interested in learning more about it.

Is the property still available? I would also like to know whether pets are allowed and how much the monthly HOA fee is.

I'm hoping to arrange a viewing sometime next week.

Thank you,
Amelia Parker`,

    reply: `Hi Amelia,

Thank you for your interest in the condominium in Scottsdale.

I'd be happy to help coordinate your inquiry.

Could you please send me the listing link or property address so I can make sure we are referring to the correct unit?

I'll forward your questions regarding current availability, pet restrictions, and monthly HOA fees to our agent for verification.

In the meantime, please let me know which days and times would work best for a potential viewing next week.

Once the property details and showing availability have been confirmed, we'll provide you with an update.` + signature
},

{
    id: 6,
    name: "Lucas Morgan",
    email: "lucas.morgan@example.com",
    subject: "Photos and property information for our listing",
    date: "2026-11-21",
    time: "10:10 AM",
    label: "Seller",
    unread: false,
    starred: false,
    important: false,
    approval: false,
    status: "sent",

    incoming: `Hi Dainty,

We've finished preparing the house for photography and have gathered the information requested for our listing.

Would you prefer that I send everything in one email or upload the files separately?

Please let me know what works best.

Thanks,

/* MAILBOX STATE */

const STORAGE = "dainty-independent-mailbox-v1";

let mails;

try {
    mails = JSON.parse(localStorage.getItem(STORAGE))
        || structuredClone(original);
    if (!Array.isArray(mails)) throw new Error();
} catch {
    mails = structuredClone(original);
}

let folder = "inbox";
let current = null;
let page = 0;
let selected = new Set();

const PAGE_SIZE = 20;

const folders = [
    ["inbox", "inbox", "Inbox"],
    ["starred", "star", "Starred"],
    ["important", "label_important", "Important"],
    ["sent", "send", "Sent"],
    ["drafts", "description", "Drafts"],
    ["all", "mail", "All Mail"],
    ["trash", "delete", "Trash"]
];

const labels = [
    ["Buyer", "Buyer Inquiries", "#a65f7d"],
    ["Seller", "Seller Inquiries", "#9176a5"],
    ["Showings", "Property Showings", "#b78c55"],
    ["Documents", "Documents", "#78938a"],
    ["Follow-ups", "Follow-ups", "#7894ae"],
    ["approval", "Awaiting Approval", "#bc9361"]
];

function icon(name) {
    return `<span class="material-symbols-outlined">${name}</span>`;
}

function esc(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
}

function save() {
    try {
        localStorage.setItem(STORAGE, JSON.stringify(mails));
    } catch {}
}

function notify(message) {
    const toast = document.getElementById("toast");
    toast.textContent = message;
    toast.classList.remove("hidden");

    clearTimeout(notify.timer);

    notify.timer = setTimeout(() => {
        toast.classList.add("hidden");
    }, 2800);
}

function formatDate(date) {
    return new Date(date + "T12:00:00")
        .toLocaleDateString("en-US", {
            month: "short",
            day: "numeric"
        });
}

function match(mail, key) {

    if (key === "trash") return Boolean(mail.trashed);
    if (mail.trashed) return false;

    switch(key) {
        case "inbox":
            return !mail.archived && Boolean(mail.incoming);
        case "starred":
            return mail.starred;
        case "important":
            return mail.important;
        case "sent":
            return mail.status === "sent";
        case "drafts":
            return mail.status === "draft";
        case "approval":
            return mail.approval;
        case "all":
            return true;
        default:
            return mail.label === key;
    }
}

function filtered() {

    const query = document.getElementById("search")
        .value.trim().toLowerCase();

    return mails.filter(mail => {

        if (query) {
            return !mail.trashed &&
                Object.values(mail).join(" ")
                    .toLowerCase().includes(query);
        }

        return match(mail, folder);

    }).sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id);
}

function navigation() {

    document.getElementById("folders").innerHTML =
        folders.map(([key, symbol, title]) => {

            const count = mails.filter(mail =>
                match(mail, key) &&
                (key !== "inbox" || mail.unread)
            ).length;

            return `
            <button class="nav ${folder === key ? "active" : ""}"
                onclick="setFolder('${key}')">
                ${icon(symbol)}
                <span class="nav-text">${title}</span>
                <span class="count">
                    ${["inbox","drafts"].includes(key) && count ? count : ""}
                </span>
            </button>`;

        }).join("");

    document.getElementById("labels").innerHTML =
        labels.map(([key, title, color]) => `
            <button class="nav ${folder === key ? "active" : ""}"
                onclick="setFolder('${key}')">
                <span style="color:${color}">${icon("label")}</span>
                <span class="nav-text">${title}</span>
            </button>
        `).join("");

    const entry = folders.find(f => f[0] === folder);

    document.getElementById("folderTitle").textContent =
        document.getElementById("search").value.trim()
            ? "Search results"
            : folder === "inbox"
                ? "Primary"
                : entry
                    ? entry[2]
                    : labels.find(l => l[0] === folder)?.[1] || folder;
}

function setFolder(key) {
    folder = key;
    page = 0;
    selected.clear();
    document.getElementById("search").value = "";
    closeMail();
}

function searchMail() {
    page = 0;
    selected.clear();
    closeMail();
}

function clearSearch() {
    document.getElementById("search").value = "";
    searchMail();
}

function render() {

    navigation();

    const results = filtered();

    page = Math.min(page,
        Math.max(0, Math.ceil(results.length / PAGE_SIZE) - 1));

    const start = page * PAGE_SIZE;
    const visible = results.slice(start, start + PAGE_SIZE);

    document.getElementById("recordCount").textContent =
        results.length
            ? `${start + 1}–${start + visible.length} of ${results.length}`
            : "0 messages";

    document.getElementById("selectAll").checked =
        visible.length > 0 &&
        visible.every(mail => selected.has(mail.id));

    document.getElementById("mailList").innerHTML =
        visible.length ? visible.map(mail => {

            const outgoing = ["sent","drafts"].includes(folder)
                || !mail.incoming;

            const preview = outgoing ? mail.reply : mail.incoming;

            return `
            <div class="mail-row
                ${mail.unread && !outgoing ? "unread" : ""}
                ${selected.has(mail.id) ? "selected" : ""}"
                onclick="openMail(${mail.id})">

                <input type="checkbox"
                    aria-label="Select message"
                    ${selected.has(mail.id) ? "checked" : ""}
                    onclick="event.stopPropagation()"
                    onchange="toggleSelected(${mail.id},this.checked)">

                <button class="star ${mail.starred ? "on" : ""}"
                    title="Star"
                    onclick="event.stopPropagation();toggleStar(${mail.id})">
                    ${mail.starred ? "★" : "☆"}
                </button>

                <button class="important ${mail.important ? "on" : ""}"
                    title="Mark important"
                    onclick="event.stopPropagation();toggleImportant(${mail.id})">
                    ${icon("label_important")}
                </button>

                <div class="sender">
                    ${outgoing
                        ? folder === "drafts" || !mail.incoming
                            ? "Draft"
                            : "To: " + esc(mail.name)
                        : esc(mail.name)}
                </div>

                ${mail.label ? `
                    <span class="label row-label">
                        ${esc(mail.label)}
                    </span>
                ` : ""}

                ${mail.approval ? `
                    <span class="label approval row-label">
                        Awaiting Approval
                    </span>
                ` : ""}

                <div class="summary">
                    ${esc(mail.subject)}
                    <span class="snippet">
                        — ${esc(preview.replace(/\n/g," "))}
                    </span>
                </div>

                <span class="date">${formatDate(mail.date)}</span>

            </div>`;

        }).join("") :

        `<div class="empty">
            ${icon("mail")}
            <p>No messages in this view.</p>
        </div>`;
}

function changePage(direction) {
    page = Math.max(0, page + direction);
    render();
}

function toggleSelected(id, checked) {
    checked ? selected.add(id) : selected.delete(id);
    render();
}

function selectAll(checked) {
    filtered().slice(page * PAGE_SIZE, (page + 1) * PAGE_SIZE)
        .forEach(mail => {
            checked ? selected.add(mail.id) : selected.delete(mail.id);
        });
    render();
}

function toggleStar(id) {
    const mail = mails.find(m => m.id === id);
    mail.starred = !mail.starred;
    save();
    render();
}

function toggleImportant(id) {
    const mail = mails.find(m => m.id === id);
    mail.important = !mail.important;
    save();
    render();
}

function apply(mail, action) {
    if (action === "archive") mail.archived = true;
    if (action === "trash") mail.trashed = true;
    if (action === "unread") mail.unread = true;

    if (action === "restore") {
        mail.archived = false;
        mail.trashed = false;
    }
}

function bulk(action) {

    if (!selected.size) {
        notify("Select a message first.");
        return;
    }

    mails.forEach(mail => {
        if (selected.has(mail.id)) apply(mail, action);
    });

    selected.clear();
    save();
    render();
    notify("Messages updated.");
}

function single(action) {
    const mail = mails.find(m => m.id === current);
    if (!mail) return;

    apply(mail, action);
    save();
    closeMail();
    notify("Message updated.");
}

/* OPEN EMAIL CONVERSATIONS */

function openMail(id) {

    const mail = mails.find(m => m.id === id);
    if (!mail) return;

    current = id;
    mail.unread = false;
    save();
    navigation();

    document.getElementById("listToolbar").classList.add("hidden");
    document.getElementById("tabs").classList.add("hidden");
    document.getElementById("mailList").classList.add("hidden");

    document.getElementById("readerToolbar").classList.remove("hidden");
    document.getElementById("reader").classList.remove("hidden");

    const initials = mail.name.split(" ")
        .slice(0,2).map(word => word[0]).join("");

    document.getElementById("thread").innerHTML = `

        <h1 class="subject">${esc(mail.subject)}</h1>

        <div class="thread-labels">

            ${mail.label
                ? `<span class="label">${esc(mail.label)}</span>`
                : ""}

            ${mail.approval
                ? `<span class="label approval">Awaiting Approval</span>`
                : ""}

        </div>

        ${mail.incoming ? `

            <div class="message-header">

                <div class="sender-avatar">${esc(initials)}</div>

                <div class="meta">
                    <strong>${esc(mail.name)}</strong>
                    <span class="address">
                        &lt;${esc(mail.email)}&gt;
                    </span>
                    <div class="address">to me</div>
                </div>

                <div class="message-time">
                    ${formatDate(mail.date)}, ${esc(mail.time)}
                </div>

                <button class="star ${mail.starred ? "on" : ""}"
                    onclick="toggleStar(${mail.id});openMail(${mail.id})">
                    ${mail.starred ? "★" : "☆"}
                </button>

            </div>

            <div class="message">${esc(mail.incoming)}</div>

            <hr>

        ` : ""}

        <div class="message-header">

            <img class="avatar" src="${PHOTO}" alt="${NAME}">

            <div class="meta">

                <strong>${NAME}</strong>

                <span class="address">
                    &lt;${ACCOUNT}&gt;
                </span>

                <div class="address">
                    to ${esc(mail.name)}
                    &lt;${esc(mail.email)}&gt;
                </div>

            </div>

            <span class="message-time">
                ${mail.status === "draft" ? "Draft" : "Sample reply"}
            </span>

        </div>

        ${mail.status === "sent" ? `

            <div class="message">${esc(mail.reply)}</div>

            <div class="reply-actions">

                <button class="secondary"
                    onclick="editReply()">
                    ${icon("reply")} Reply
                </button>

                <button class="secondary"
                    onclick="copyReply()">
                    ${icon("content_copy")} Copy
                </button>

            </div>

        ` : `

            <div class="reply-box">

                <textarea id="replyText">${esc(mail.reply)}</textarea>

                <div class="reply-actions">

                    <button class="primary" onclick="saveReply()">
                        Save Draft
                    </button>

                    <button class="secondary" onclick="flagApproval()">
                        ${icon("flag")}
                        ${mail.approval ? "Remove Flag" : "Flag for Approval"}
                    </button>

                    <button class="icon" title="Copy"
                        onclick="copyReply()">
                        ${icon("content_copy")}
                    </button>

                </div>

            </div>

        `}

    `;

    document.getElementById("reader").scrollTop = 0;
}

function closeMail() {
    current = null;

    document.getElementById("reader").classList.add("hidden");
    document.getElementById("readerToolbar").classList.add("hidden");

    document.getElementById("listToolbar").classList.remove("hidden");
    document.getElementById("tabs").classList.remove("hidden");
    document.getElementById("mailList").classList.remove("hidden");

    render();
}

function navigate(direction) {
    const list = filtered();
    const index = list.findIndex(mail => mail.id === current);
    const next = list[index + direction];

    if (next) openMail(next.id);
}

function editReply() {
    const mail = mails.find(m => m.id === current);
    if (!mail) return;

    document.getElementById("thread").insertAdjacentHTML(
        "beforeend",
        `<div class="reply-box" id="newReply">
            <textarea id="replyText"
                placeholder="Write a reply..."></textarea>
            <div class="reply-actions">
                <button class="primary"
                    onclick="saveFollowup()">Save Draft</button>
                <button class="icon" title="Discard"
                    onclick="document.getElementById('newReply').remove()">
                    ${icon("delete")}
                </button>
            </div>
        </div>`
    );

    document.getElementById("replyText").focus();
}

function saveFollowup() {
    const mail = mails.find(m => m.id === current);
    const text = document.getElementById("replyText").value.trim();

    if (!text) return notify("Write your reply first.");

    mails.push({
        id: Date.now(),
        name: mail.name,
        email: mail.email,
        subject: "Re: " + mail.subject,
        date: new Date().toISOString().slice(0,10),
        time: "",
        label: mail.label,
        incoming: "",
        reply: text,
        status: "draft",
        unread: false,
        starred: false,
        important: false,
        approval: false
    });

    save();
    setFolder("drafts");
    notify("Reply saved to Drafts.");
}

function saveReply() {
    const mail = mails.find(m => m.id === current);
    if (!mail) return;

    mail.reply = document.getElementById("replyText").value;
    mail.status = "draft";
    save();
    notify("Draft saved.");
}

function flagApproval() {
    const mail = mails.find(m => m.id === current);

    mail.reply = document.getElementById("replyText").value;
    mail.approval = !mail.approval;

    save();
    openMail(mail.id);
    notify(mail.approval ? "Flagged for approval." : "Flag removed.");
}

async function copyReply() {
    const mail = mails.find(m => m.id === current);
    const text = document.getElementById("replyText")?.value || mail.reply;

    try {
        await navigator.clipboard.writeText(text);
        notify("Email copied.");
    } catch {
        notify("Select the email text and press Ctrl+C.");
    }
}

/* COMPOSE */

function openCompose() {
    document.getElementById("composeWindow").classList.remove("hidden");
}

function closeCompose() {
    document.getElementById("composeWindow").classList.add("hidden");
}

function saveNewMail(event) {

    event.preventDefault();

    const data = Object.fromEntries(new FormData(event.target));

    mails.push({
        id: Date.now(),
        name: data.recipient,
        email: data.recipient,
        subject: data.subject,
        date: new Date().toISOString().slice(0,10),
        time: "",
        label: "",
        incoming: "",
        reply: data.body,
        status: "draft",
        unread: false,
        starred: false,
        important: false,
        approval: false
    });

    save();
    event.target.reset();
    closeCompose();
    setFolder("drafts");
    notify("Draft saved.");
}

document.addEventListener("click", event => {

    const profile = document.getElementById("profile");

    if (!profile.contains(event.target) &&
        !event.target.closest(".account")) {
        profile.classList.add("hidden");
    }

});

document.addEventListener("keydown", event => {

    if (event.key === "Escape") {
        closeCompose();
        document.getElementById("profile").classList.add("hidden");
    }

});

render();

</script>
