
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inbox | Dainty De Guzman</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined&display=swap" rel="stylesheet">

<style>
:root {
    --pink: #a65f7d;
    --background: #faf2f6;
    --selected: #efd3e2;
    --border: #eee3e9;
    --text: #302a2e;
    --muted: #756b71;
}

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font: 14px Roboto, Arial, sans-serif;
    background: var(--background);
    color: var(--text);
}

button, input {
    font: inherit;
}

button {
    border: none;
    background: transparent;
    color: inherit;
    cursor: pointer;
}

button:hover {
    background: #eee0e8;
}

.material-symbols-outlined {
    font-size: 21px;
    vertical-align: middle;
}

.icon {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: inline-grid;
    place-items: center;
    flex-shrink: 0;
}

.hidden {
    display: none !important;
}

header {
    height: 72px;
    display: flex;
    align-items: center;
    padding: 10px 20px;
    gap: 18px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 220px;
    flex-shrink: 0;
}

.brand-name {
    font-size: 23px;
    color: #60535b;
}

.search {
    display: flex;
    align-items: center;
    flex: 1;
    max-width: 720px;
    background: #f0e2ea;
    padding: 5px 14px;
    border-radius: 30px;
}

.search input {
    width: 100%;
    border: none;
    outline: none;
    background: transparent;
    padding: 12px;
    min-width: 0;
}

.account {
    margin-left: auto;
    border-radius: 50%;
    padding: 4px;
    flex-shrink: 0;
}

.avatar {
    width: 39px;
    height: 39px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
}

.layout {
    display: flex;
    height: calc(100dvh - 72px);
    padding-bottom: 15px;
}

.sidebar {
    width: 250px;
    flex-shrink: 0;
    padding: 10px 12px 20px 0;
    overflow: auto;
}

.mailbox-heading {
    background: #eac5d8;
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 18px 24px;
    border-radius: 17px;
    margin: 0 12px 22px 15px;
    font-weight: 500;
    color: #654256;
}

.nav {
    display: flex;
    align-items: center;
    gap: 17px;
    width: 100%;
    padding: 11px 25px;
    border-radius: 0 25px 25px 0;
    text-align: left;
}

.nav.active {
    background: var(--selected);
    font-weight: 700;
}

.count {
    margin-left: auto;
    font-size: 12px;
}

.labels-title {
    padding: 28px 25px 12px;
    font-size: 16px;
    font-weight: 500;
}

.main {
    flex: 1;
    min-width: 0;
    background: white;
    margin-right: 16px;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

.toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 18px;
    min-height: 56px;
}

.toolbar-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 12px;
    color: var(--muted);
}

.view-only {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--muted);
    font-size: 12px;
    padding: 8px 4px;
}

.view-only .material-symbols-outlined {
    font-size: 18px;
}

.tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
}

.tab {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 18px 24px;
    border-bottom: 3px solid var(--pink);
    color: var(--pink);
    font-weight: 500;
    min-width: 220px;
}

.mail-list {
    flex: 1;
    overflow: auto;
}

.mail-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 18px;
    min-height: 48px;
    background: #fcf7fa;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
}

.mail-row.unread {
    background: white;
    font-weight: 700;
}

.mail-row:hover {
    box-shadow: inset 0 1px #ded1d9,
                inset 0 -1px #ded1d9,
                0 2px 5px #0001;
}

.mail-row:focus-visible {
    outline: 2px solid var(--pink);
    outline-offset: -2px;
}

.star {
    color: #a99da5;
    font-size: 23px;
    padding: 2px;
    flex-shrink: 0;
}

.star.on {
    color: #d4a139;
}

.important {
    color: #b9adb4;
    padding: 3px;
    flex-shrink: 0;
}

.important.on {
    color: var(--pink);
}

.sender {
    width: 170px;
    flex-shrink: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.summary {
    flex: 1;
    min-width: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.snippet {
    font-weight: 400;
    color: var(--muted);
}

.date {
    font-size: 12px;
    width: 65px;
    flex-shrink: 0;
    text-align: right;
}

.label {
    background: #f1e0ea;
    color: #80536b;
    font-size: 10px;
    padding: 4px 7px;
    border-radius: 4px;
    white-space: nowrap;
    font-weight: 400;
}

.label.approval {
    background: #f7e8ce;
    color: #89632d;
}

.empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
}

.reader {
    overflow: auto;
    flex: 1;
}

.thread {
    max-width: 1000px;
    margin: auto;
    padding: 28px 45px 50px;
}

.subject {
    font-size: 25px;
    font-weight: 400;
    line-height: 1.4;
    margin: 0 0 15px;
}

.thread-labels {
    display: flex;
    gap: 7px;
    margin-bottom: 30px;
    flex-wrap: wrap;
}

.message-header {
    display: flex;
    align-items: flex-start;
    gap: 14px;
}

.sender-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: #eac5d8;
    color: #654256;
    display: grid;
    place-items: center;
    flex-shrink: 0;
}

.meta {
    flex: 1;
    min-width: 0;
    line-height: 1.7;
}

.address {
    color: var(--muted);
    font-size: 12px;
    overflow-wrap: anywhere;
}

.message-time {
    font-size: 12px;
    color: var(--muted);
}

.message {
    white-space: pre-wrap;
    line-height: 1.85;
    padding: 20px 0 25px 54px;
    overflow-wrap: anywhere;
}

hr {
    border: none;
    border-top: 1px solid var(--border);
    margin: 20px 0 30px;
}

.reply-box {
    margin: 20px 0 0 54px;
    border: 1px solid #e3d3dc;
    border-radius: 12px;
    box-shadow: 0 2px 6px #0001;
    overflow: hidden;
}

.draft-heading {
    background: #faf2f6;
    color: var(--pink);
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    font-weight: 500;
}

.draft-content {
    padding: 20px;
    white-space: pre-wrap;
    line-height: 1.8;
    overflow-wrap: anywhere;
}

.draft-footer {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 11px;
}

.notice {
    padding: 9px 18px;
    font-size: 10px;
    color: var(--muted);
    border-top: 1px solid var(--border);
}

button:disabled {
    opacity: 0.35;
    cursor: default;
    background: transparent;
}

@media(max-width: 900px) {

    .brand {
        width: auto;
    }

    .brand-name {
        display: none;
    }

    .sender {
        width: 125px;
    }

    .row-label {
        display: none;
    }

}

@media(max-width: 650px) {

    header {
        padding: 8px;
        gap: 6px;
    }

    .sidebar {
        width: 65px;
        padding-right: 5px;
    }

    .sidebar .nav-text,
    .sidebar .count,
    .sidebar .labels-title,
    .sidebar .mailbox-text {
        display: none;
    }

    .sidebar .nav {
        justify-content: center;
        padding: 12px;
    }

    .mailbox-heading {
        padding: 13px;
        margin-left: 7px;
        margin-right: 0;
        justify-content: center;
    }

    .main {
        margin-right: 7px;
    }

    .brand svg {
        width: 30px;
    }

    .mail-row {
        flex-wrap: wrap;
        padding: 12px;
    }

    .sender {
        flex: 1;
        width: auto;
    }

    .summary {
        flex-basis: 100%;
        white-space: normal;
    }

    .date {
        margin-left: auto;
    }

    .thread {
        padding: 20px;
    }

    .message {
        padding-left: 0;
    }

    .reply-box {
        margin-left: 0;
    }

    .message-header {
        flex-wrap: wrap;
    }

    .toolbar {
        padding: 8px;
        gap: 1px;
    }

    .toolbar .icon {
        width: 30px;
    }

    .subject {
        font-size: 21px;
    }

}
</style>
</head>

<script>

const signature = `

/* ========================================
   ORIGINAL INDEPENDENT EMAIL CONVERSATIONS

const original = [

{
    id: 2,
    name: "Daniel Foster",
    email: "daniel.foster@example.com",
    subject: "Request to reschedule Saturday's property showing",
    date: "2026-11-25",
    time: "9:16 AM",
    label: "Showings",
    unread: true,
    starred: false,

    status: "sent",

    incoming: `Hi Dainty,

Daniel`,

    reply: `Hi Daniel,

},

{
    id: 3,
    name: "Madison Clarke",
    email: "madison.clarke@example.com",
    subject: "Questions about listing my property",
    date: "2026-11-24",
    time: "3:42 PM",
    label: "Seller",
    unread: true,
    starred: true,
    important: true,
    approval: true,
    status: "draft",

    incoming: `Hello,

Kind regards,
Madison Clarke`,

    reply: `Hi Madison,

},

{
    id: 4,
    name: "Benjamin Scott",
    email: "benjamin.scott@example.com",
    subject: "Following up on the documents I submitted",
    date: "2026-11-23",
    time: "11:08 AM",
    label: "Documents",
    unread: false,

    important: true,
    approval: false,
    status: "sent",

    incoming: `Hi,

Please let me know if there is anything else I need to submit before our next appointment.

Thanks,
Benjamin Scott`,

    reply: `Hi Benjamin,

Thank you for the update.

I've noted that you submitted the requested documents through the secure upload link yesterday.

Thank you for your cooperation.` + signature
},

{
    id: 5,
    name: "Amelia Parker",

{
    id: 6,
    name: "Lucas Morgan",

    date: "2026-11-21",
    time: "10:10 AM",
    label: "Seller",

Lucas`,

{
    id: 7,
    name: "Grace Sullivan",
    email: "grace.sullivan@example.com",

{
    id: 8,
    name: "Henry Collins",
    email: "henry.collins@example.com",
    subject: "Question regarding my purchase offer",

    time: "1:20 PM",

Henry Collins`,

    reply: `Hi Henry,

];

/* ========================================
   READ-ONLY MAILBOX STATE
======================================== */

const mails = Object.freeze(
    original.map(mail => Object.freeze({...mail}))
);

let folder = "inbox";
let current = null;

const folders = [
    ["inbox", "inbox", "Inbox"],
    ["starred", "star", "Starred"],
    ["important", "label_important", "Important"],
    ["sent", "send", "Sent"],
    ["drafts", "description", "Drafts"],
    ["all", "mail", "All Mail"],
    ["trash", "delete", "Trash"]
];

const labels = [
    ["Buyer", "Buyer Inquiries", "#a65f7d"],
    ["Seller", "Seller Inquiries", "#9176a5"],
    ["Showings", "Property Showings", "#b78c55"],
    ["Documents", "Documents", "#78938a"],
    ["Follow-ups", "Follow-ups", "#7894ae"],
    ["approval", "Awaiting Approval", "#bc9361"]
];

function icon(name) {

    return `<span class="material-symbols-outlined">${name}</span>`;

}

function esc(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");

}

function formatDate(date) {

    return new Date(date + "T12:00:00")
        .toLocaleDateString("en-US", {
            month: "short",
            day: "numeric"
        });

}

/* ========================================
   MAILBOX FOLDERS AND LABELS
======================================== */

function match(mail, key) {

    switch(key) {

        case "inbox":
            return Boolean(mail.incoming);

        case "starred":
            return mail.starred;

        case "important":
            return mail.important;

        case "sent":
            return mail.status === "sent";

        case "drafts":
            return mail.status === "draft";

        case "approval":
            return mail.approval;

        case "all":
            return true;

        case "trash":
            return false;

        default:
            return mail.label === key;

    }

}

function filtered() {

    const query = document.getElementById("search")
        .value.trim().toLowerCase();

    return mails.filter(mail => {

        if (query) {

            return Object.values(mail)
                .join(" ")
                .toLowerCase()
                .includes(query);

        }

        return match(mail, folder);

    }).sort((a, b) =>

        b.date.localeCompare(a.date) || a.id - b.id

    );

}

function navigation() {

    document.getElementById("folders").innerHTML =
        folders.map(([key, symbol, title]) => {

            const count = mails.filter(mail =>

                match(mail, key) &&
                (key !== "inbox" || mail.unread)

            ).length;

            return `

                <button class="nav ${folder === key ? "active" : ""}"
                    title="${title}"
                    aria-label="${title}"
                    onclick="setFolder('${key}')">

                    ${icon(symbol)}

                    <span class="nav-text">
                        ${title}
                    </span>

                    <span class="count">

                        ${["inbox", "drafts"].includes(key) && count
                            ? count
                            : ""}

                    </span>

                </button>

            `;

        }).join("");

    document.getElementById("labels").innerHTML =
        labels.map(([key, title, color]) => `

            <button class="nav ${folder === key ? "active" : ""}"
                title="${title}"
                aria-label="${title}"
                onclick="setFolder('${key}')">

                <span style="color:${color}">
                    ${icon("label")}
                </span>

                <span class="nav-text">
                    ${title}
                </span>

            </button>

        `).join("");

    const entry = folders.find(f => f[0] === folder);

    document.getElementById("folderTitle").textContent =

        document.getElementById("search").value.trim()

            ? "Search results"

            : folder === "inbox"

                ? "Primary"

                : entry

                    ? entry[2]

                    : labels.find(l => l[0] === folder)?.[1]
                        || folder;

}

function setFolder(key) {

    folder = key;

    document.getElementById("search").value = "";

    closeMail();

}

function searchMail() {

    closeMail();

}

function clearSearch() {

    document.getElementById("search").value = "";

    searchMail();

}

/* ========================================
   READ-ONLY EMAIL LIST
======================================== */

function render() {

    navigation();

    const results = filtered();

    document.getElementById("recordCount").textContent =

        results.length

            ? `1–${results.length} of ${results.length}`

            : "0 messages";

    document.getElementById("mailList").innerHTML =

        results.length ? results.map(mail => {

            const outgoing =
                ["sent", "drafts"].includes(folder);

            const preview =
                outgoing ? mail.reply : mail.incoming;

            return `

                <div class="mail-row
                    ${mail.unread && !outgoing ? "unread" : ""}"

                    role="button"
                    tabindex="0"
                    aria-label="Read ${esc(mail.subject)}"

                    onclick="openMail(${mail.id})"

                    onkeydown="if(event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        openMail(${mail.id});
                    }">

                    <span class="star ${mail.starred ? "on" : ""}"
                        title="${mail.starred ? "Starred" : "Not starred"}">

                        ${mail.starred ? "★" : "☆"}

                    </span>

                    <span class="important ${mail.important ? "on" : ""}"
                        title="${mail.important ? "Important" : "Not marked important"}">

                        ${icon("label_important")}

                    </span>

                    <div class="sender">

                        ${outgoing

                            ? folder === "drafts"

                                ? '<span style="color:#a65f7d">Draft</span>'

                                : "To: " + esc(mail.name)

                            : esc(mail.name)}

                    </div>

                    ${mail.label ? `

                        <span class="label row-label">

                            ${esc(mail.label)}

                        </span>

                    ` : ""}

                    ${mail.approval ? `

                        <span class="label approval row-label">

                            Awaiting Approval

                        </span>

                    ` : ""}

                    <div class="summary">

                        ${esc(mail.subject)}

                        <span class="snippet">

                            — ${esc(preview.replace(/\n/g, " "))}

                        </span>

                    </div>

                    <span class="date">

                        ${formatDate(mail.date)}

                    </span>

                </div>

            `;

        }).join("") :

        `<div class="empty">

            ${icon("mail")}

            <p>No messages in this view.</p>

        </div>`;

}

/* ========================================
   OPEN ORIGINAL EMAIL CONVERSATIONS
======================================== */

function openMail(id) {

    const mail = mails.find(m => m.id === id);

    if (!mail) return;

    current = id;

    document.getElementById("listToolbar")
        .classList.add("hidden");

    document.getElementById("tabs")
        .classList.add("hidden");

    document.getElementById("mailList")
        .classList.add("hidden");

    document.getElementById("readerToolbar")
        .classList.remove("hidden");

    document.getElementById("reader")
        .classList.remove("hidden");

    const initials = mail.name.split(" ")
        .slice(0, 2)
        .map(word => word[0])
        .join("");

    document.getElementById("thread").innerHTML = `

        <h1 class="subject">

            ${esc(mail.subject)}

        </h1>

        <div class="thread-labels">

            ${mail.label

                ? `<span class="label">

                    ${esc(mail.label)}

                </span>`

                : ""}

            ${mail.approval

                ? `<span class="label approval">

                    Awaiting Approval

                </span>`

                : ""}

        </div>

        <div class="message-header">

            <div class="sender-avatar">

                ${esc(initials)}

            </div>

            <div class="meta">

                <strong>

                    ${esc(mail.name)}

                </strong>

                <span class="address">

                    &lt;${esc(mail.email)}&gt;

                </span>

                <div class="address">

                    to me

                </div>

            </div>

            <div class="message-time">

                ${formatDate(mail.date)}, ${esc(mail.time)}

            </div>

            <span class="star ${mail.starred ? "on" : ""}">

                ${mail.starred ? "★" : "☆"}

            </span>

        </div>

        <div class="message">${esc(mail.incoming)}</div>

        <hr>

        <div class="message-header">

            <img class="avatar"
                src="${PHOTO}"
                alt="${NAME}">

            <div class="meta">

                <strong>

                    ${NAME}

                </strong>

                <span class="address">

                    &lt;${ACCOUNT}&gt;

                </span>

                <div class="address">

                    to ${esc(mail.name)}

                    &lt;${esc(mail.email)}&gt;

                </div>

            </div>

            <span class="message-time">

                ${mail.status === "draft"

                    ? "Draft"

                    : "Sample reply"}

            </span>

        </div>

        ${mail.status === "sent" ? `

            <div class="message">${esc(mail.reply)}</div>

        ` : `

            <div class="reply-box">

                <div class="draft-heading">

                    ${icon("description")}

                    Draft — Awaiting Agent Approval

                </div>

                <div class="draft-content">${esc(mail.reply)}</div>

                <div class="draft-footer">

                    Prepared response · Not sent · View only

                </div>

            </div>

        `}

    `;

    const list = filtered();

    const index = list.findIndex(item => item.id === current);

    document.getElementById("threadPosition").textContent =

        index >= 0

            ? `${index + 1} of ${list.length}`

            : "";

    document.getElementById("previousMail").disabled =
        index <= 0;

    document.getElementById("nextMail").disabled =
        index < 0 || index >= list.length - 1;

    document.getElementById("reader").scrollTop = 0;

}

/* ========================================
   RETURN TO MAILBOX
======================================== */

function closeMail() {

    current = null;

    document.getElementById("reader")
        .classList.add("hidden");

    document.getElementById("readerToolbar")
        .classList.add("hidden");

    document.getElementById("listToolbar")
        .classList.remove("hidden");

    document.getElementById("tabs")
        .classList.remove("hidden");

    document.getElementById("mailList")
        .classList.remove("hidden");

    render();

}

/* ========================================
   PREVIOUS AND NEXT EMAIL
======================================== */

function navigate(direction) {

    const list = filtered();

    const index = list.findIndex(mail => mail.id === current);

    const next = list[index + direction];

    if (next) {

        openMail(next.id);

    }

}

/* ========================================
   KEYBOARD NAVIGATION
======================================== */

document.addEventListener("keydown", event => {

    if (event.key === "Escape" && current !== null) {

        closeMail();

    }

});

/* ========================================
   INITIALIZATION
======================================== */

render();

</script>

</body>
</html>
