
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gmail</title>
<style>
*{box-sizing:border-box}
body{margin:0;font:14px Arial,sans-serif;background:#faf1f6;color:#3c3439}
header{height:72px;display:flex;align-items:center;gap:22px;padding:12px 25px}
.logo{font-size:23px;display:flex;align-items:center;gap:12px;width:210px}
header input{border:0;background:#f0e0e9;border-radius:28px;padding:15px 24px;width:600px;max-width:50%;font:inherit;outline:none}
.avatar{width:36px;height:36px;border-radius:50%;object-fit:cover;margin-left:auto}
.layout{display:flex;height:calc(100dvh - 72px)}
aside{width:235px;flex-shrink:0;padding:20px 15px}
.nav{border:0;background:transparent;width:100%;padding:12px 22px;text-align:left;border-radius:24px;font:inherit;cursor:pointer}
.nav.active{background:#eacbdb;font-weight:bold}
main{background:white;border-radius:20px;flex:1;margin:0 16px 16px 0;overflow:auto;min-width:0}
.toolbar{padding:18px 25px;border-bottom:1px solid #eee4e9;display:flex;justify-content:space-between}
.mail{display:grid;grid-template-columns:180px 1fr 65px;gap:15px;padding:16px 24px;border-bottom:1px solid #eee4e9;background:#fdf8fb;cursor:pointer}
.mail:hover{background:#f5e6ee}
.sender,.subject{font-weight:600}
.preview{color:#8c7e85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.date{text-align:right;font-size:12px}
.reader{padding:25px 40px}
.reader h2{font-size:23px;font-weight:400;margin:20px 0 35px}
.message{border-bottom:1px solid #eee4e9;padding:20px 0}
.message-header{display:flex;gap:15px;align-items:center}
.initial{border-radius:50%;width:40px;height:40px;background:#bd85a1;color:white;display:grid;place-items:center;font-size:19px}
.message-body{white-space:pre-wrap;line-height:1.8;margin:25px 0 20px 55px}
.small{font-size:12px;color:#8b7c84}
.back{border:0;background:transparent;font-size:24px;cursor:pointer}
@media(max-width:700px){aside{width:105px;padding:10px 4px}.nav{padding:12px}.logo{width:auto}.mail{grid-template-columns:1fr;gap:5px}.date{text-align:left}.reader{padding:20px}.message-body{margin-left:0}}
</style>
</head>
<body>
<header>
<div class="logo">
<svg width="34" height="26" viewBox="0 0 34 26">
<path d="M3 24V3L17 14L31 3V24" fill="none" stroke="#a65f7d" stroke-width="6" stroke-linejoin="round"/>
</svg>
Gmail
</div>
<input id="search" placeholder="Search mail" oninput="showList()">
<img class="avatar" src="dainty-profile.jpeg" alt="Profile">
</header>
<div class="layout">
<aside id="navigation"></aside>
<main id="mailbox"></main>
</div>
<script>
const account="daintydeguzman.work@gmail.com";
const mails=[
{
name:"Charlotte Hayes",date:"Nov 25",subject:"Inquiry about homes in Raleigh",star:true,folder:"Sent",
body:`Hello,

I'm looking for a three-bedroom, two-bathroom home in Raleigh with a garage and backyard. My budget is around $420,000.

Could you let me know what the next steps are?

Thank you,
Charlotte`,
reply:`Hi Charlotte,

Thank you for reaching out. I've noted your preferred location, property features, and budget.

I'll forward your requirements to the assigned agent for a review of suitable properties. Could you also share your preferred move-in timeline and availability for an initial consultation?

Best regards,
Dainty De Guzman`
},
{
name:"Daniel Foster",date:"Nov 24",subject:"Request to reschedule property showing",star:false,folder:"Sent",
body:`Hi,

I won't be available for Saturday's showing. Would Monday after 2 PM work instead?

Thanks,
Daniel`,
reply:`Hi Daniel,

Thank you for letting us know. I've noted your availability for Monday after 2 PM.

I'll coordinate with the assigned agent and verify property access before confirming the revised appointment.

Best regards,
Dainty De Guzman`
},
{
name:"Madison Clarke",date:"Nov 23",subject:"Selling my property in Tampa",star:true,folder:"Drafts",
body:`Hello,

I'm considering selling my four-bedroom, three-bathroom home in Tampa. The kitchen was recently renovated, and I'm hoping to list it around $560,000.

Could you provide information about pricing, commission, and the selling timeline?

Madison`,
reply:`Hi Madison,

Thank you for providing these details about your property.

I've recorded your proposed listing price and property features. Our licensed agent can discuss market pricing, commission arrangements, and the appropriate selling strategy during a consultation.

Please let me know your availability so I can coordinate an appointment.

Best regards,
Dainty De Guzman`
},
{
name:"Benjamin Scott",date:"Nov 22",subject:"Document submission instructions",star:false,folder:"Sent",
body:`Hi,

Could you confirm how I should submit the documents requested by the agent?

Benjamin`,
reply:`Hi Benjamin,

Thank you for checking. For your privacy, please use the secure document submission method provided by the agent rather than sending sensitive documents through ordinary email.

I'll coordinate with the agent to verify the appropriate submission instructions.

Best regards,
Dainty De Guzman`
},
{
name:"Amelia Parker",date:"Nov 21",subject:"Scottsdale condominium inquiry",star:true,folder:"Drafts",
body:`Hello,

Is the condominium in Scottsdale still available? I'd also like to know whether pets are permitted, the HOA fees, and when I could arrange a viewing.

Amelia`,
reply:`Hi Amelia,

Thank you for your interest. I'll coordinate with the listing agent to verify current availability, applicable pet restrictions, and HOA information.

Could you share your preferred viewing dates and times?

Best regards,
Dainty De Guzman`
},
{
name:"Lucas Morgan",date:"Nov 20",subject:"Property photos and listing information",star:false,folder:"Sent",
body:`Hi,

I've prepared the property photographs and information requested for the listing. Please let me know if anything else is needed.

Lucas`,
reply:`Hi Lucas,

Thank you for preparing the materials. I'll organize the photographs and property information for the agent's review and check whether any required listing details are missing.

I'll follow up if further clarification is needed.

Best regards,
Dainty De Guzman`
},
{
name:"Grace Sullivan",date:"Nov 19",subject:"Update on my property search",star:false,folder:"Sent",
body:`Hello,

I've decided to postpone my home search until spring. Thank you for your assistance so far.

Grace`,
reply:`Hi Grace,

Thank you for the update. I've noted that your property search is on hold until spring.

With your permission, we can reconnect closer to your intended timeline. Please feel free to reach out whenever you're ready.

Best regards,
Dainty De Guzman`
},
{
name:"Henry Collins",date:"Nov 19",subject:"Question about submitting an offer",star:true,folder:"Drafts",
body:`Hi,

I'm interested in the property listed at $395,000 and would like to discuss a possible offer of $380,000.

What should I do next?

Henry`,
reply:`Hi Henry,

Thank you for sharing your proposed offer amount.

I'll forward your inquiry to the licensed agent, who can advise you on the offer process and discuss the relevant terms.

Please let me know when you're available for a consultation.

Best regards,
Dainty De Guzman`
}
];
let folder="Inbox";
const folders=["Inbox","Starred","Sent","Drafts","All Mail"];
function navigation(){
document.getElementById("navigation").innerHTML=folders.map(f=>`<button class="nav ${folder===f?"active":""}" onclick="changeFolder('${f}')">${f}</button>`).join("");
}
function changeFolder(f){folder=f;showList()}
function showList(){
navigation();
const q=document.getElementById("search").value.toLowerCase();
const list=mails.map((m,i)=>({m,i})).filter(({m})=>
(folder==="Inbox"||folder==="All Mail"||(folder==="Starred"&&m.star)||m.folder===folder)&&
Object.values(m).join(" ").toLowerCase().includes(q));
document.getElementById("mailbox").innerHTML=`
<div class="toolbar"><strong>${folder}</strong><span>${list.length} conversations</span></div>
${list.map(({m,i})=>`
<div class="mail" tabindex="0" onclick="openMail(${i})" onkeydown="if(event.key==='Enter')openMail(${i})">
<div class="sender">${folder==="Drafts"?"Draft: ":folder==="Sent"?"To: ":""}${m.name}</div>
<div class="preview"><span class="subject">${m.subject}</span> — ${folder==="Sent"||folder==="Drafts"?m.reply:m.body}</div>
<div class="date">${m.date}</div>
</div>`).join("")}`;
}
function openMail(i){
const m=mails[i];
const email=m.name.toLowerCase().replace(" ",".")+"@example.com";
document.getElementById("mailbox").innerHTML=`
<div class="toolbar"><button class="back" onclick="showList()" aria-label="Back">←</button></div>
<div class="reader">
<h2>${m.subject}</h2>
<div class="message">
<div class="message-header">
<div class="initial">${m.name[0]}</div>
<div><strong>${m.name}</strong> <span class="small">&lt;${email}&gt;</span><br><span class="small">to me · ${m.date}, 2026</span></div>
</div>
<div class="message-body">${m.body}</div>
</div>
<div class="message">
<div class="message-header">
<img class="avatar" style="margin:0;width:40px;height:40px" src="dainty-profile.jpeg" alt="Profile">
<div><strong>Dainty De Guzman</strong> <span class="small">&lt;${account}&gt;</span><br><span class="small">${m.folder==="Drafts"?"Draft · Not sent":"to "+m.name}</span></div>
</div>
<div class="message-body">${m.reply}</div>
</div>
</div>`;
}
showList();
</script>
</body>
</html>
